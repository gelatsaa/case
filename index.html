  .bd-star3{ display:none; }
  .peek-star{ left:-8px; width:34px; }
  .peek-frame{ box-shadow:7px 7px 0 var(--pop-shadow); }
  .sticker{ font-size:13px; padding:7px 11px; }
  .pub-foot nav{ width:100%; }
}
@media (max-width:420px){
  .auth{ padding:18px 12px 28px; }
  .auth-card{ box-shadow:5px 5px 0 var(--pop-shadow); }
  .ab-1{ width:220px; height:220px; left:-110px; top:-90px; }
  .ab-2{ width:180px; height:180px; right:-80px; bottom:-80px; }
}

/* ---------- "A day in your CASE!" subtle refresh (same layout/content; more colour + depth) ---------- */
.band-lilac{ --band:#efe9fb; padding-bottom:96px; }
html[data-theme="dark"] .band-lilac{ --band:#25212e; }
.day{ --am:#3b6fd4; }
.day-head h2 .mark{ --mk:#7a5cd6; }
.day-star{ display:inline-block; width:26px; margin-left:10px; vertical-align:super; transform:rotate(10deg); }
/* the day as a timeline: dotted line through the moments, colour chip per moment */
.day-tabs{ position:relative; gap:6px; }
.day-tabs::before{ content:''; position:absolute; left:30px; top:30px; bottom:30px; border-left:2px dashed color-mix(in srgb, var(--ink) 22%, transparent); }
.moment{ position:relative; border:2px solid transparent; padding:11px 16px 11px 14px; transition:background .25s ease, border-color .25s ease, box-shadow .25s ease, transform .2s ease; }
.moment:hover{ background:color-mix(in srgb, var(--mc) 10%, transparent); }
.moment[aria-selected="true"]{ background:var(--card); border-color:var(--pop-edge); box-shadow:4px 4px 0 var(--mc); }
.moment[aria-selected="true"]:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--mc); }
.m-dot{ width:30px; height:30px; grid-row:1 / span 2; align-self:center; display:grid; place-items:center; opacity:1; position:relative; z-index:1;
  background:color-mix(in srgb, var(--mc) 16%, var(--card)); border:2px solid color-mix(in srgb, var(--mc) 55%, var(--card)); color:var(--mc); transition:background .25s ease, color .25s ease, border-color .25s ease; }
.moment[aria-selected="true"] .m-dot{ background:var(--mc); color:#fff; border-color:var(--pop-edge); transform:none; }
.moment[aria-selected="true"] .m-time{ color:var(--mc); }
/* description follows the active moment's colour */
.day-desc{ background:var(--card); border:1.5px solid var(--line); border-left:4px solid var(--am); border-radius:12px; padding:12px 14px; margin-top:16px; color:var(--ink2); transition:border-color .3s ease; }
.day-try-l{ color:var(--ink2); }
.swatch[aria-checked="true"]{ box-shadow:0 0 0 2.5px var(--band, var(--paper)), 0 0 0 4.5px var(--ink); }
/* preview: ink edge + hard shadow in the active moment's colour */
.ws{ border:2px solid var(--pop-edge); box-shadow:10px 10px 0 var(--am); transition:background .35s ease, border-color .35s ease, box-shadow .35s ease; }
.day-cap{ color:var(--ink); }

@media (max-width:860px){
  .band-lilac{ padding-bottom:80px; }
  .day-tabs::before{ display:none; }
  .moment{ border-color:var(--line); background:var(--card); }
  .moment[aria-selected="true"]{ border-color:var(--pop-edge); }
  .m-dot{ width:26px; height:26px; }
}
@media (max-width:640px){
  .band-lilac{ padding-bottom:64px; }
  .ws{ box-shadow:6px 6px 0 var(--am); }
  .day-star{ width:20px; }
}

@media (max-width:640px){ .cta-band{ box-shadow:6px 6px 0 #1b1b22; } html[data-theme="dark"] .cta-band{ box-shadow:6px 6px 0 #000; } }

/* ---------- closing CTA section: orange band behind the (unchanged) black card ---------- */
.band-orange{ --band:#ffa266; padding-bottom:96px; }
html[data-theme="dark"] .band-orange{ --band:#c9713f; }
.pub-foot{ margin-top:0; }   /* orange band flows straight into the sky-blue footer band */
@media (max-width:860px){ .band-orange{ padding-bottom:80px; } }
@media (max-width:640px){ .band-orange{ padding-bottom:64px; } }

/* =====================================================================================
   CASE! DESIGN SYSTEM (Phase 1)
   Tokens + shared primitives used by the app. Page-specific redesigns (Phase 2) should build on
   these instead of adding one-off colours/shadows.
   - Palette: ink + six pastels (mint, lilac, coral, sky, butter, tangerine), each with a
     surface tint (-s, adapts to theme) and a text-safe deep tone (-d, adapts to theme).
   - Edges: 1.5px ink outline (--edge) + hard offset shadow (--hard-*) = the CASE! "sticker" look.
   - Use colour for meaning (page, priority, state), not decoration.
   ===================================================================================== */
:root{
  --mint:#a9dcbd; --lilac:#d9ccf5; --coral:#ffb3a7; --sky:#bfe1f2; --butter:#ffe38f; --tangerine:#ffa266;
  --mint-s:#e6f4ea; --lilac-s:#f1ecfb; --coral-s:#fdecea; --sky-s:#e8f3fa; --butter-s:#fff6d6;
  --mint-d:#2e7249; --lilac-d:#5a42ad; --coral-d:#b23e2c; --sky-d:#225f82; --butter-d:#7c5b00;
  --edge:#1b1b22; --edge-sh:#1b1b22; --on-pastel:#1b1b22;
  --hard-1:2px 2px 0 var(--edge-sh); --hard-2:3px 3px 0 var(--edge-sh); --hard-3:5px 5px 0 var(--edge-sh);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --fs-page:30px; --fs-card:17px; --fs-body:15px; --fs-label:12.5px; --fs-meta:12px;
  --ease-pop:cubic-bezier(.3,.7,.4,1.2);
}
html[data-theme="dark"]{
  /* dark mode keeps the sticker language: outlines lift slightly, hard shadows go true black,
     pastels stay pastel for fills (with ink text) and become deep tints for surfaces */
  --edge:#5d574f; --edge-sh:#000;
  --mint-s:#223429; --lilac-s:#2a2536; --coral-s:#35231f; --sky-s:#1f2d37; --butter-s:#342d1b;
  --mint-d:#8fd4a8; --lilac-d:#bba8f5; --coral-d:#ffab9c; --sky-d:#8fcbea; --butter-d:#f2cc59;
}

/* ---------- shared primitives ---------- */
:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }
.btn{ transition:transform .15s var(--ease-pop), box-shadow .15s ease, background .15s ease, border-color .15s ease; }
.btn:hover{ border-color:var(--edge); }
.btn.primary{ border-color:var(--solid); }
.btn.primary:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--butter); }
.btn.primary:active, .btn:active{ transform:translate(1px,1px); box-shadow:none; }
.btn.ghost:hover{ border-color:transparent; }
.btn.danger:hover{ border-color:var(--red-d); }
.iconbtn{ transition:background .15s ease, color .15s ease; }
.iconbtn:hover{ color:var(--ink); }
.field{ transition:border-color .15s ease, box-shadow .15s ease; }
.field:hover{ border-color:color-mix(in srgb, var(--edge) 45%, var(--line2)); }
.field:focus-visible, .field:focus{ outline:none; border-color:var(--edge); box-shadow:2px 2px 0 var(--accent); }
.modal{ border:1.5px solid var(--edge); box-shadow:var(--hard-3); }
.mtitle{ font-size:21px; }
.toast{ border:1.5px solid var(--edge-sh); box-shadow:var(--hard-2); }
.seg button[aria-pressed="true"]{ box-shadow:var(--hard-1); border-color:var(--edge); }
.prio-pill{ border:1.5px solid color-mix(in srgb, var(--pc) 45%, transparent); background:color-mix(in srgb, var(--pc) 12%, var(--card)); color:color-mix(in srgb, var(--pc) 80%, var(--ink)); }
.folder-pill{ border:1.5px solid color-mix(in srgb, var(--fc) 40%, transparent); }

/* ---------- sidebar ---------- */
.sidebar{ background:var(--paper2); border-right:1.5px solid var(--edge); }
.brand{ padding:2px 10px 18px; }
.brand-mark{ font-size:28px; }
#nav{ gap:4px; }
#nav a{ gap:11px; padding:7px 10px 7px 7px; border-radius:13px; font-weight:800; font-size:14.5px; color:var(--ink2); border:1.5px solid transparent; transition:background .15s ease, box-shadow .15s ease, transform .15s var(--ease-pop), color .15s ease; }
#nav a svg{ width:32px; height:32px; padding:6px; border-radius:10px; color:var(--c,var(--ink3)); background:color-mix(in srgb, var(--c,var(--ink3)) 13%, transparent); transition:background .15s ease, color .15s ease; }
#nav a:hover{ background:color-mix(in srgb, var(--c,var(--ink3)) 8%, transparent); color:var(--ink); }
#nav a[aria-current="page"]{ background:var(--card); border-color:var(--edge); color:var(--ink); box-shadow:3px 3px 0 var(--c,var(--edge-sh)); }
#nav a[aria-current="page"] svg{ background:var(--c,var(--ink)); color:#fff; }
html[data-theme="dark"] #nav a[href="#/"]{ --c:#f2efe9 !important; }
html[data-theme="dark"] #nav a[href="#/"][aria-current="page"] svg{ color:#1c1b19; }
.side-folders{ border-top:1.5px dashed var(--line2); }
.sf{ border-radius:10px; transition:background .15s ease; }
.sf:hover{ background:color-mix(in srgb, var(--ink) 5%, transparent); color:var(--ink); }
.sfoot-btn{ border-radius:11px; font-weight:800; transition:background .15s ease; }
.sfoot-btn[aria-current="page"]{ background:var(--card); border:1.5px solid var(--edge); box-shadow:var(--hard-1); }
.navbtn.menu{ border-color:var(--edge) !important; box-shadow:var(--hard-1); background:var(--card) !important; color:var(--ink); }

/* =====================================================================================
   HOME / DASHBOARD — a playful, organized desk
   ===================================================================================== */
.home{ container:home / inline-size; }
.banner{ height:132px; border-radius:var(--r-lg); border:1.5px solid var(--edge); box-shadow:var(--hard-2); }
.ident{ margin:-30px 0 20px 20px; gap:14px; flex-wrap:wrap; align-items:flex-end; }
.ident .hello, .ident .streak{ margin-bottom:4px; }
.avatar{ border:3px solid var(--card); box-shadow:0 0 0 1.5px var(--edge), var(--hard-2); }
.hello{ padding-top:0; flex:1 1 200px; min-width:0; padding-bottom:2px; }
.hello h1{ font-size:24px; line-height:1.2; }
.hello p{ margin:3px 0 0; font-size:13.5px; font-weight:700; color:var(--ink3); }

/* streak: a compact reward badge in the greeting row */
.streak{ display:inline-flex; align-items:center; gap:9px; padding:6px 14px 6px 8px; margin:0 4px 2px 0; border:1.5px solid var(--edge); border-radius:var(--r-pill);
  background:var(--card); box-shadow:var(--hard-1); flex:none; transition:transform .2s var(--ease-pop), box-shadow .2s ease; }
.streak:hover{ transform:translate(-1px,-1px) rotate(-1deg); box-shadow:var(--hard-2); }
.sk-flame{ width:30px; height:30px; border-radius:50%; background:var(--butter-s); display:grid; place-items:center; }
.sk-flame svg{ width:18px; height:22px; }
.streak:hover .sk-flame svg{ animation:flick .6s ease-in-out 2; }
@keyframes flick{ 50%{ transform:scale(1.12) rotate(4deg); } }
.sk-txt{ display:flex; flex-direction:column; gap:3px; }
.sk-line{ display:flex; align-items:baseline; gap:5px; line-height:1; }
.sk-line b{ font-family:var(--font-head); font-size:21px; font-weight:700; }
.streak-cap{ font-size:12px; font-weight:800; color:var(--ink2); }
.sk-week{ display:flex; gap:3px; }
.sk-dot{ width:8px; height:8px; border-radius:50%; background:var(--line2); }
.sk-dot.on{ background:var(--tangerine); }
.sk-dot.today{ box-shadow:0 0 0 1.5px var(--edge); }

/* the desk: three columns whose last cards stretch so every column ends on one line */
.dash{ display:flex; gap:18px; align-items:stretch; }
.dcol{ display:flex; flex-direction:column; gap:18px; min-width:0; }
.dcol-a{ flex:1.45 1 0; } .dcol-b, .dcol-c{ flex:1 1 0; }
.dcol > :last-child{ flex:1 1 auto; }
.home .card{ border:1.5px solid var(--edge); border-radius:18px; box-shadow:var(--hard-2); }
.home .wtitle{ font-size:var(--fs-card); display:inline-block; margin-bottom:10px; background:linear-gradient(transparent 60%, var(--acc-s, transparent) 60%); padding:0 3px; margin-left:-3px; }
html[data-theme="dark"] .home .wtitle{ background:linear-gradient(transparent 60%, color-mix(in srgb, var(--acc-s, transparent) 32%, transparent) 60%); }
.dash-hint{ margin:14px 2px 0; font-size:13px; color:var(--ink3); font-weight:600; }
.dash-hint a{ color:var(--accent-text); font-weight:800; }
.home > .idx{ margin-top:18px; }

/* per-widget accent (meaningful, not rainbow): to-do green, progress lilac, timer coral, calendar sky */
.todo-card{ --acc-s:var(--mint); }
.progress-w{ --acc-s:var(--lilac); }
.home .timer{ --acc-s:var(--coral); }

/* ---------- planner (calendar anchor) ---------- */
.planner{ container:planner / inline-size; position:relative; display:flex; flex-direction:column; gap:12px; padding:20px 18px 16px; }
.planner::before{ content:''; position:absolute; top:-11px; left:50%; width:92px; height:22px; transform:translateX(-50%) rotate(-2.5deg);
  background:repeating-linear-gradient(-45deg, rgba(255,255,255,.4) 0 6px, transparent 6px 12px), var(--sky); border:1px solid color-mix(in srgb, var(--edge) 35%, transparent); border-radius:3px; opacity:.95; }
.pc-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
.pc-title{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.pc-title h2{ font-size:30px; line-height:1; letter-spacing:-.015em; }
.pc-year{ font-family:'Caveat','Segoe Print',cursive; font-weight:600; font-size:22px; color:var(--ink3); line-height:1; }
.pc-tools{ display:flex; gap:6px; flex:none; }
.pc-nav{ min-width:34px; height:34px; padding:0 9px; border-radius:10px; border:1.5px solid var(--edge); background:var(--card); color:var(--ink); box-shadow:var(--hard-1); display:inline-grid; place-items:center; font-weight:800; font-size:13px; cursor:pointer; transition:transform .15s var(--ease-pop), box-shadow .15s ease; }
.pc-nav:hover{ transform:translate(-1px,-1px); box-shadow:var(--hard-2); }
.pc-nav:active{ transform:translate(1px,1px); box-shadow:none; }
.pc-today{ align-self:flex-start; display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:var(--r-pill); background:var(--butter); color:var(--on-pastel); border:1.5px solid var(--edge); font-size:13px; font-weight:700; }
.pc-grid{ flex:1 1 auto; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:auto repeat(var(--weeks,5), minmax(42px,1fr)); gap:4px; }
.pc-w{ text-align:center; font-size:11px; font-weight:800; color:var(--ink3); letter-spacing:.04em; text-transform:uppercase; padding-bottom:2px; }
.pc-w.wknd{ color:var(--lilac-d); }
.pc-d{ position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:5px 6px; min-width:0; overflow:hidden; border-radius:10px; background:var(--paper2); border:1.5px solid transparent; color:var(--ink); transition:border-color .15s ease, transform .15s var(--ease-pop); }
.pc-d.wknd{ background:var(--lilac-s); }
.pc-d.out{ opacity:.42; }
.pc-d:hover{ border-color:var(--edge); }
.pc-d.today{ background:var(--butter); border-color:var(--edge); box-shadow:var(--hard-1); color:var(--on-pastel); }
.pc-n{ font-size:13.5px; font-weight:800; line-height:1.15; }
.pc-ev{ display:none; max-width:100%; font-size:11px; font-weight:700; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 5px; border-radius:5px; border-left:3px solid var(--ec); background:color-mix(in srgb, var(--ec) 16%, var(--card)); color:var(--ink); }
.pc-d.today .pc-ev{ color:var(--on-pastel); background:rgba(255,255,255,.6); }
.pc-dots{ display:flex; gap:3px; margin-top:auto; }
.pc-dots i{ width:6px; height:6px; border-radius:50%; }
.pc-up{ border-top:1.5px dashed var(--line2); padding-top:10px; }
.pc-up-h{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.pc-up-h h3{ font-size:15px; }
.pc-up ul{ list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; }
.pc-up li a{ display:flex; align-items:center; gap:10px; padding:5px 6px; border-radius:11px; transition:background .15s ease; }
.pc-up li a:hover{ background:var(--paper2); }
.pc-up-d{ width:40px; flex:none; text-align:center; line-height:1.05; padding:3px 0 4px; border:1.5px solid var(--edge); border-radius:9px; background:var(--card); }
.pc-up-d b{ display:block; font-family:var(--font-head); font-size:16px; }
.pc-up-d i{ font-style:normal; font-size:10px; font-weight:800; color:var(--ink3); text-transform:uppercase; }
.pc-up-t{ min-width:0; display:flex; flex-direction:column; border-left:3px solid var(--ec); padding-left:8px; }
.pc-up-t span{ font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pc-up-t small{ font-size:11.5px; font-weight:700; color:var(--ink3); }
.pc-empty{ margin:6px 0 0; font-size:13px; color:var(--ink3); }
.pc-empty a{ color:var(--accent-text); font-weight:800; }
@container planner (min-width:520px){
  .pc-ev{ display:block; } .pc-d.has .pc-dots{ display:none; }
  .pc-up ul{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .pc-title h2{ font-size:34px; }
}
@container planner (max-width:340px){
  .pc-grid{ gap:3px; grid-template-rows:auto repeat(var(--weeks,5), minmax(38px,1fr)); }
  .pc-d{ padding:4px; align-items:center; }
  .pc-n{ font-size:12.5px; }
  .pc-dots{ margin:auto auto 0; }
  .pc-title h2{ font-size:26px; }
}

/* ---------- to-do + progress on the desk ---------- */
.todo-card .trow .ttext{ white-space:normal; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-overflow:clip; line-height:1.3; }
.todo-card .todo-foot .more, .home .more{ font-weight:800; }
.plusbtn{ border:1.5px solid var(--edge) !important; box-shadow:var(--hard-1); transition:transform .15s var(--ease-pop), box-shadow .15s ease; }
.plusbtn:hover{ transform:translate(-1px,-1px); box-shadow:var(--hard-2); }
.progress-w{ display:flex; flex-direction:column; }
.progress-w .pg-body{ flex:1; align-items:center; gap:16px; }
.home .progress-w .pg-ringwrap{ width:92px; height:92px; }
.home .progress-w .pg-ringwrap svg{ width:92px; height:92px; }
.home .progress-w .pg-pct{ font-size:20px; }
.home .progress-w .pg-sub{ font-size:13.5px; font-weight:700; color:var(--ink2); }

.home .trow .cb{ width:24px; height:24px; }
.home .trow .star, .home .trow .tdel{ min-width:28px; min-height:28px; display:inline-grid; place-items:center; }
.home .trow .ttext{ min-height:26px; }
.home .more{ display:inline-flex; align-items:center; min-height:28px; }
/* ---------- timer ---------- */
.home .timer .tm-mode{ border-radius:var(--r-pill); font-weight:800; }
.home .timer .tm-mode[aria-pressed="true"]{ border:1.5px solid var(--edge); box-shadow:var(--hard-1); }
.home .timer .tm-step{ border:1.5px solid var(--edge); }
.home .timer .tm-toggle:hover{ box-shadow:3px 3px 0 var(--coral); }

/* ---------- ambience mini player ---------- */
.amb{ display:flex; flex-direction:column; gap:10px; }
.amb-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.amb-head .wtitle{ display:inline-flex; align-items:center; gap:6px; margin:0; --acc-s:var(--lilac); }
.amb .music-now{ font-size:12px; font-weight:700; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.amb-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.amb-chip, .amb-more{ display:inline-flex; align-items:center; gap:5px; min-height:34px; padding:4px 11px; border-radius:var(--r-pill); border:1.5px solid var(--line2); background:var(--card); color:var(--ink); font-weight:800; font-size:12.5px; cursor:pointer; transition:border-color .15s ease, background .15s ease, box-shadow .15s ease; }
.amb-more{ padding-right:6px; max-width:100%; }
.amb-chip:hover, .amb-more:hover{ border-color:var(--edge); }
.amb-chip[aria-pressed="true"]{ background:var(--lilac); color:var(--on-pastel); border-color:var(--edge); box-shadow:var(--hard-1); }
.amb-player{ --g1:var(--butter); --g2:var(--coral); display:flex; align-items:center; gap:12px; padding:10px 10px 10px 10px; border-radius:15px; border:1.5px solid var(--edge);
  background:linear-gradient(135deg, var(--g1), var(--g2)); color:var(--on-pastel); position:relative; overflow:hidden; }
.amb-player::after{ content:''; position:absolute; right:-18px; top:-22px; width:84px; height:84px; border-radius:50%; background:rgba(255,255,255,.28); pointer-events:none; }
.amb[data-k="lofi"] .amb-player{ --g1:var(--lilac); --g2:var(--sky); }
.amb[data-k="rain"] .amb-player{ --g1:var(--sky); --g2:#aec3e6; }
.amb[data-k="nature"] .amb-player{ --g1:var(--mint); --g2:var(--butter); }
.amb[data-k="study"] .amb-player{ --g1:var(--sky); --g2:var(--mint); }
.amb[data-k="fireplace"] .amb-player{ --g1:var(--coral); --g2:var(--tangerine); }
.amb[data-k="calm"] .amb-player{ --g1:var(--sky); --g2:var(--lilac); }
.amb[data-k="focus"] .amb-player{ --g1:var(--lilac); --g2:var(--coral); }
.amb-art{ width:46px; height:46px; flex:none; border-radius:12px; border:1.5px solid var(--edge); background:rgba(255,255,255,.7); display:grid; place-items:center; font-size:24px; line-height:1; position:relative; z-index:1; }
.amb.is-playing .amb-art{ animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-2px) rotate(-3deg); } }
.amb-info{ flex:1; min-width:0; display:flex; flex-direction:column; position:relative; z-index:1; }
.amb-name{ font-family:var(--font-head); font-size:17px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.amb-state{ font-size:12px; font-weight:800; opacity:.78; font-variant-numeric:tabular-nums; }
.amb-eq{ display:flex; align-items:flex-end; gap:2px; height:12px; margin-top:4px; }
.amb-eq i{ width:3px; height:3px; border-radius:1px; background:var(--on-pastel); opacity:.5; }
.amb.is-playing .amb-eq i{ opacity:.8; animation:eq 1s ease-in-out infinite; animation-delay:calc(var(--i) * -.19s); }
@keyframes eq{ 0%,100%{ height:3px; } 50%{ height:12px; } }
.amb-play{ width:46px; height:46px; flex:none; border-radius:50%; border:1.5px solid var(--edge); background:#1b1b22; color:#fffdf8; display:grid; place-items:center; cursor:pointer; box-shadow:2px 2px 0 rgba(255,255,255,.65); position:relative; z-index:1; transition:transform .15s var(--ease-pop); }
.amb-play svg{ width:20px; height:20px; }
.amb-play:hover{ transform:scale(1.06); }
.amb-play:active{ transform:scale(.96); }
.amb-vol{ display:flex; align-items:center; gap:6px; }
.amb-vol .music-vol{ flex:1; min-width:0; height:28px; accent-color:var(--purple); cursor:pointer; }
.amb-note{ margin:auto 0 0; font-size:11.5px; line-height:1.4; color:var(--ink3); }

/* ---------- quick access (folders / notes / moodboard) ---------- */
.home .idxtab{ border:1.5px solid var(--line2); transition:transform .15s var(--ease-pop), box-shadow .15s ease, border-color .15s ease; }
.home .idxtab:hover{ border-color:var(--edge); }
.home .idxtab[aria-selected="true"]{ border-color:var(--edge); box-shadow:3px 3px 0 var(--tc, var(--edge-sh)); transform:translateY(-1px); }
.home .idxtab .tabic svg{ color:var(--tc); }
.home .ftile, .home .ncard{ border:1.5px solid var(--edge); transition:transform .15s var(--ease-pop), box-shadow .15s ease; }
.home .ftile:hover, .home .ncard:hover{ transform:translate(-1px,-1px); box-shadow:var(--hard-1); }
.home .ncard{ color:var(--on-pastel); }
.home .ftile.dashed, .home .ncard.dashed{ border-style:dashed; border-color:var(--line2); color:var(--ink2); }

/* ---------- responsive composition (by available width, not viewport) ---------- */
@container home (max-width:1020px){
  .dash{ flex-wrap:wrap; }
  .dcol-a{ flex:1.25 1 0; } .dcol-b{ flex:1 1 0; }
  .dcol-c{ flex:1 1 100%; flex-direction:row; align-items:stretch; }
  .dcol-c > *{ flex:1 1 0; }
}
@container home (max-width:640px){
  .dash{ flex-direction:column; }
  /* single stack: column wrappers drop out of layout so every card gets the same spacing */
  .dcol-a, .dcol-b{ display:contents; }
  .dcol-c{ flex:none; }
  .dcol-a > *, .dcol-b > *{ flex:none; }
  .dcol-c > *{ flex:1 1 0; min-width:0; }
  .ident{ margin:-30px 0 16px 12px; }
  .hello h1{ font-size:21px; }
}
@container home (max-width:520px){
  .dcol-c{ flex-direction:column; }
  .dcol-c > *{ flex:none; }
  .banner{ height:108px; }
  .streak{ margin-left:0; }
}

/* =====================================================================================
   Targeted fixes: pearl default theme, greeting/streak spacing, banner & photo access,
   progress explanation, storage-status warning.
   ===================================================================================== */
/* ---------- Pearl: the default light theme for the APP (public pages keep their approved look) ---------- */
html[data-theme="light"] body:not(.public){
  --paper:#fbf8f3; --paper2:#fffdf9; --card:#ffffff; --line:#efe8dd; --line2:#e2d9cb;
  background:
    radial-gradient(900px 520px at 0% 0%, rgba(255,227,143,.22), transparent 62%),
    radial-gradient(820px 560px at 100% 0%, rgba(191,225,242,.20), transparent 60%),
    radial-gradient(900px 640px at 100% 100%, rgba(217,204,245,.20), transparent 62%),
    radial-gradient(760px 520px at 0% 100%, rgba(169,220,189,.16), transparent 60%),
    #fbf8f3;
  background-attachment:fixed;
}
html[data-theme="light"] body:not(.public) .sidebar{ background:rgba(255,253,249,.82); backdrop-filter:blur(6px); }
html[data-theme="light"] body:not(.public) .pc-d:not(.today){ background:#faf5ec; }
html[data-theme="light"] body:not(.public) .pc-d.wknd:not(.today){ background:#f4effc; }

/* ---------- greeting + streak: sit clearly below the banner ---------- */
.ident{ margin:-30px 0 18px 20px; align-items:flex-start; position:relative; z-index:1; }
.ident .hello, .ident .streak{ margin-top:44px; margin-bottom:0; }
.hello h1{ font-size:24px; font-weight:600; color:var(--ink); letter-spacing:-.005em; }
.hello h1 .greet-name{ background:linear-gradient(transparent 62%, color-mix(in srgb, var(--butter) 70%, transparent) 62%); padding:0 2px; }
.hello p{ color:var(--ink2); }

/* ---------- photo + banner: obvious, reachable from Home ---------- */
.banner{ position:relative; }
.banner-edit{ position:absolute; right:12px; top:12px; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; min-height:32px; border-radius:var(--r-pill);
  border:1.5px solid var(--edge); background:rgba(255,255,255,.92); color:#1b1b22; font-weight:800; font-size:12.5px; cursor:pointer; box-shadow:var(--hard-1); transition:transform .15s var(--ease-pop), box-shadow .15s ease; }
.banner-edit:hover{ transform:translate(-1px,-1px); box-shadow:var(--hard-2); }
.ident .avatar{ position:relative; padding:0; cursor:pointer; }
.avatar-edit{ position:absolute; right:-2px; bottom:2px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--butter); color:#1b1b22; border:1.5px solid var(--edge); box-shadow:var(--hard-1); transition:transform .15s var(--ease-pop); }
.ident .avatar:hover .avatar-edit{ transform:scale(1.1) rotate(-8deg); }
.banner-set{ display:flex; flex-direction:column; gap:8px; }
.banner-prev{ height:74px; border-radius:14px; border:1.5px solid var(--edge); box-shadow:var(--hard-1); overflow:hidden; background:var(--card) center/cover no-repeat; }
.banner-prev svg{ width:100%; height:100%; display:block; }

/* ---------- progress: say what it measures ---------- */
.progress-w{ gap:8px; }
.progress-w .pg-head{ margin-bottom:0; }
.pg-what{ margin:-2px 0 2px; font-size:13px; color:var(--ink2); font-weight:600; line-height:1.45; }
.pg-side{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.home .progress-w .pg-sub{ font-family:var(--font-head); font-size:17px; font-weight:600; color:var(--ink); }
.pg-bar{ display:flex; height:12px; border-radius:var(--r-pill); overflow:hidden; border:1.5px solid var(--edge); background:var(--paper2); }
.pg-seg{ flex-basis:0; min-width:8px; }
.pg-seg + .pg-seg{ border-left:1.5px solid var(--edge); }
.pg-seg.done, .pg-key.done i{ background:var(--green); }
.pg-seg.part, .pg-key.part i{ background:var(--sky); }
.pg-seg.todo, .pg-key.todo i{ background:var(--line); }
.pg-legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; font-weight:700; color:var(--ink2); }
.pg-key{ display:inline-flex; align-items:center; gap:4px; }
.pg-key i{ width:10px; height:10px; border-radius:3px; border:1.5px solid var(--edge); }
.pg-key b{ color:var(--ink); }
.pg-how{ margin-top:auto; border-top:1.5px dashed var(--line2); padding-top:8px; font-size:13px; }
.pg-how summary{ cursor:pointer; font-weight:800; color:var(--accent-text); min-height:26px; display:flex; align-items:center; }
.pg-how p{ margin:6px 0 8px; color:var(--ink2); line-height:1.5; }

/* ---------- storage status: warn when nothing can be saved ---------- */
.sync.warn::before, .sync.warn .dot{ background:var(--orange) !important; }
.sync.warn{ color:var(--red-d); font-weight:800; }

@container home (max-width:640px){
  .ident{ margin:-28px 0 16px 12px; row-gap:10px; }
  .ident .hello{ margin-top:40px; flex:1 1 calc(100% - 110px); }
  .ident .streak{ margin-top:0; }
  .banner-edit{ top:8px; right:8px; padding:5px 10px; }
}

/* =====================================================================================
   PHASE 2 — private pages share the CASE! design system, each with its own accent
   ===================================================================================== */
body:not(.public){ --pa:var(--butter); --pa-s:var(--butter-s); --pa-d:var(--butter-d); }
body[data-page="todo"]{ --pa:var(--mint); --pa-s:var(--mint-s); --pa-d:var(--mint-d); }
body[data-page="notes"]{ --pa:var(--butter); --pa-s:var(--butter-s); --pa-d:var(--butter-d); }
body[data-page="calendar"]{ --pa:var(--sky); --pa-s:var(--sky-s); --pa-d:var(--sky-d); }
body[data-page="folders"]{ --pa:var(--tangerine); --pa-s:var(--butter-s); --pa-d:var(--coral-d); }
body[data-page="moodboard"]{ --pa:var(--coral); --pa-s:var(--coral-s); --pa-d:var(--coral-d); }
body[data-page="settings"]{ --pa:var(--lilac); --pa-s:var(--lilac-s); --pa-d:var(--lilac-d); }

/* page titles: friendly serif with a pastel highlighter + a small sparkle */
body:not(.public) .page .ptitle{ font-size:32px; display:inline-block; position:relative; padding:0 4px; margin-left:-4px; letter-spacing:-.01em;
  background:linear-gradient(transparent 62%, color-mix(in srgb, var(--pa) 75%, transparent) 62%); }
body:not(.public) .page .ptitle::after{ content:''; position:absolute; right:-18px; top:-2px; width:14px; height:14px; background:var(--pa);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); }
html[data-theme="dark"] body:not(.public) .page .ptitle{ background:linear-gradient(transparent 62%, color-mix(in srgb, var(--pa) 30%, transparent) 62%); }
body:not(.public) .page .psub{ color:var(--ink2); font-weight:600; }

/* cards: the same sticker language as Home (settings stays calmer) */
body:not(.public) .page .card{ border:1.5px solid var(--edge); border-radius:18px; box-shadow:var(--hard-2); }
body[data-page="settings"] .page .card{ box-shadow:var(--hard-1); }
body:not(.public) .page .seg{ border-radius:var(--r-pill); }
body:not(.public) .page .seg button{ border-radius:var(--r-pill); }
body:not(.public) .page .seg button[aria-pressed="true"]{ background:var(--pa); color:var(--on-pastel); }
body:not(.public) .page .empty > svg{ width:62px; height:62px; padding:12px; border-radius:50%; background:var(--pa-s); color:var(--pa-d); border:1.5px dashed color-mix(in srgb, var(--pa-d) 45%, transparent); }

/* ---------- To-do: productive + encouraging ---------- */
body[data-page="todo"] .pagehead{ align-items:center; }
body[data-page="todo"] .pagehead .psub{ margin:2px 0 0; }
.tstreak{ display:inline-flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; border-radius:22px; background:var(--butter-s); border:1.5px solid var(--edge); box-shadow:var(--hard-1);
  flex:none; transition:transform .2s var(--ease-pop), box-shadow .2s ease; }
.tstreak:hover{ transform:translate(-1px,-1px) rotate(-1deg); box-shadow:var(--hard-2); }
.tstreak .sk-flame{ background:var(--card); }
.tstreak-txt{ display:flex; flex-direction:column; line-height:1.15; }
.tstreak-txt small{ font-size:12px; font-weight:700; color:var(--ink2); }
.tstreak .sk-week{ margin-left:4px; }
.tprog{ height:8px; border-radius:var(--r-pill); background:var(--paper2); border:1.5px solid var(--edge); overflow:hidden; margin:0 0 16px; }
.tprog i{ display:block; height:100%; background:linear-gradient(90deg, var(--mint), var(--green)); border-radius:var(--r-pill); transition:width .45s var(--ease-pop); }
.addcard .add-actions{ display:flex; gap:8px; flex:none; }
body[data-page="todo"] .paperwrap .trow{ border-radius:10px; transition:background .15s ease; }
body[data-page="todo"] .paperwrap .trow:not(.blank):hover{ background:color-mix(in srgb, var(--mint) 14%, transparent); }
body[data-page="todo"] .trow .cb.on{ animation:pop .3s var(--ease-pop); }
@keyframes pop{ 50%{ transform:scale(1.18); } }

/* ---------- Notes: creative + calm, expandable writing workspace ---------- */
.notes-layout{ grid-template-columns:minmax(0,300px) minmax(0,1fr); transition:grid-template-columns .35s var(--ease-pop); }
.page.wide{ transition:max-width .35s var(--ease-pop); }
.nlist{ background:var(--paper2); }
.nitem{ border-left:0; border:1.5px solid transparent; position:relative; padding-left:16px; transition:background .15s ease, border-color .15s ease; }
.nitem::before{ content:''; position:absolute; left:6px; top:12px; bottom:12px; width:4px; border-radius:4px; background:var(--nc, var(--butter)); }
.nitem:hover{ background:var(--card); }
.nitem[aria-current="true"]{ background:var(--card); border-color:var(--edge); box-shadow:3px 3px 0 var(--nc, var(--butter)); }
.neditor{ border-top:1.5px solid var(--edge); position:relative; padding:18px 22px 16px; background:var(--card); }
.neditor::before{ content:''; position:absolute; top:-11px; left:28px; width:84px; height:20px; transform:rotate(-3deg); border-radius:3px;
  background:repeating-linear-gradient(-45deg, rgba(255,255,255,.45) 0 6px, transparent 6px 12px), var(--nc, var(--butter)); border:1px solid color-mix(in srgb, var(--edge) 30%, transparent); }
.neditor .ehead{ flex-wrap:wrap; row-gap:8px; }
.bulkbar[hidden]{ display:none !important; }
.efoot .save-status{ margin-left:10px; }   /* pre-existing: display:flex was overriding [hidden], leaving an empty bar */
.neditor .ehead select.field{ width:auto; flex:0 1 190px; min-width:110px; }
.neditor .rt-toolbar{ border-radius:14px; background:var(--paper2); border-color:var(--line2); }
.neditor .ntitle{ font-size:28px; }
.neditor .nbody{ font-size:16px; line-height:1.8; }

/* ---------- Calendar: organized + cheerful (planner language) ---------- */
.cal-main{ position:relative; }
.cal-main::before{ content:''; position:absolute; top:-11px; left:50%; width:96px; height:22px; transform:translateX(-50%) rotate(-2.5deg); border-radius:3px;
  background:repeating-linear-gradient(-45deg, rgba(255,255,255,.4) 0 6px, transparent 6px 12px), var(--sky); border:1px solid color-mix(in srgb, var(--edge) 35%, transparent); }
.cal-title{ font-size:26px; }
.cal-grid > .cell:nth-child(7n+6), .cal-grid > .cell:nth-child(7n){ background:var(--lilac-s); }
.cell{ border-radius:12px; transition:border-color .15s ease, transform .15s var(--ease-pop); }
.cell:hover{ border-color:var(--edge); }
.cell.today{ background:var(--butter-s); border-color:var(--edge); box-shadow:var(--hard-1); }
.cell.today .num{ background:var(--butter); color:var(--on-pastel); box-shadow:0 0 0 1.5px var(--edge); }
.cell.sel{ box-shadow:0 0 0 2px var(--sky-d) inset, var(--hard-1); }
.chip{ border-radius:var(--r-pill); padding:2px 7px; }
.cal-side .card{ border-radius:18px; }

/* ---------- Folders: organized + playful ---------- */
.ftile.big{ border:1.5px solid var(--line2); border-radius:16px; background:var(--card); transition:transform .15s var(--ease-pop), box-shadow .15s ease, border-color .15s ease; }
.ftile.big:hover{ transform:translate(-1px,-2px); border-color:var(--edge); box-shadow:var(--hard-2); }
.ftile.picked{ border-color:var(--edge); box-shadow:0 0 0 3px var(--tangerine), var(--hard-1); }
.fgrid.drop{ background:var(--butter-s); outline:2px dashed var(--coral-d); }
.crumbs a, .crumbs [aria-current]{ padding:3px 10px; border-radius:var(--r-pill); }
.crumbs a:hover{ background:var(--butter-s); text-decoration:none; }
.crumbs [aria-current]{ background:var(--card); border:1.5px solid var(--edge); }

/* ---------- Moodboard: creative + expressive ---------- */
.mb-vp{ border:1.5px solid var(--edge); box-shadow:var(--hard-3); border-radius:20px; }
.mb-boards{ border:1.5px solid var(--edge); border-radius:16px; box-shadow:var(--hard-1); }
.tgroup{ flex-wrap:wrap; }

/* ---------- Settings: clean + calm ---------- */
.set-nav a{ border:1.5px solid transparent; border-radius:12px; }
.set-nav a[aria-current="page"]{ border-color:var(--edge); box-shadow:3px 3px 0 var(--lilac); }
.set-nav a[aria-current="page"] svg{ color:var(--lilac-d); }

/* ---------- responsive (and the Notes phone overflow fix) ---------- */
@media (max-width:860px){
  .notes-layout{ grid-template-columns:minmax(0,1fr); }
  .nl-top{ flex-wrap:wrap; }
  .nl-top .field{ flex:1 1 100%; }
  .rt-toolbar{ max-width:100%; }
}
@media (max-width:640px){
  body[data-page="todo"] .pagehead{ align-items:flex-start; }
  .tstreak .sk-week{ display:none; }
  .addcard .add-actions{ width:100%; }
  .addcard .add-actions .btn{ flex:1; justify-content:center; }
  .neditor{ padding:16px 14px 12px; }
}

/* ---------- Notes: collapsible notes list (sidebar) ---------- */
.nl-panel{ display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; flex:1; transition:opacity .2s ease; }
.nl-toggle{ flex:none; color:var(--ink2); }
.nl-panel > .nl-top{ flex-wrap:wrap; align-items:center; }
.nl-panel > .nl-top .nl-toggle{ margin-right:auto; }
.nl-panel > .nl-top .field{ order:5; flex:1 1 100%; }
.nl-toggle:hover{ color:var(--ink); background:var(--butter-s); }
.nl-rail{ display:none; flex-direction:column; align-items:center; gap:8px; }
.nl-rail .iconbtn{ width:36px; height:36px; border-radius:11px; border:1.5px solid var(--edge); background:var(--card); box-shadow:var(--hard-1); display:grid; place-items:center; }
.nl-rail .iconbtn:hover{ transform:translate(-1px,-1px); box-shadow:var(--hard-2); background:var(--butter-s); }
.notes-layout.list-collapsed{ grid-template-columns:56px minmax(0,1fr); }
.notes-layout.list-collapsed .nlist{ padding:10px 0; align-items:center; overflow:hidden; }
.notes-layout.list-collapsed .nl-panel{ display:none; }
.notes-layout.list-collapsed .nl-rail{ display:flex; }
@media (max-width:860px){
  /* phones/tablets already show list OR editor, so the sidebar toggle isn't needed there */
  .nl-toggle, .nl-rail{ display:none !important; }
  .notes-layout.list-collapsed{ grid-template-columns:minmax(0,1fr); }
  .notes-layout.list-collapsed .nlist{ padding:14px; align-items:stretch; }
  .notes-layout.list-collapsed .nl-panel{ display:flex; }
}
/* ---------- Home quick-access panels: compact, capped previews ---------- */
.idx{ container:qa / inline-size; }
.home .idxpanel{ min-height:0; }
.qa-head{ align-items:center; margin-bottom:12px; }
.qa-title{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.qa-title h3{ font-size:17px; }
.qa-count{ font-size:12px; font-weight:800; color:var(--ink2); padding:2px 9px; border-radius:var(--r-pill); background:var(--butter-s); border:1.5px solid var(--line2); white-space:nowrap; }
.qa-actions{ display:flex; align-items:center; gap:10px; flex:none; }
.qa-new{ width:30px; height:30px; border-radius:9px; border:1.5px solid var(--edge); background:var(--card); color:var(--ink); display:grid; place-items:center; cursor:pointer; box-shadow:var(--hard-1); transition:transform .15s var(--ease-pop), box-shadow .15s ease; }
.qa-new:hover{ transform:translate(-1px,-1px); box-shadow:var(--hard-2); }
.qa-more{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-align:center; border:1.5px dashed var(--edge) !important; background:var(--butter-s) !important; color:var(--ink) !important; }
.qa-more b{ font-family:var(--font-head); font-size:22px; line-height:1; }
.qa-more span{ font-size:12.5px; font-weight:800; color:var(--ink2); }
.qa-more:hover{ background:var(--butter) !important; }
.qa-empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:18px 12px 8px; }
.qa-empty p{ margin:0; max-width:40ch; color:var(--ink2); font-size:14px; font-weight:600; line-height:1.5; }
.qa-empty-ic{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--butter-s); color:var(--butter-d); border:1.5px dashed color-mix(in srgb, var(--butter-d) 45%, transparent); }
/* folders */

.home .ncards.qa-grid{ grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }

.qa-when{ margin-top:auto; font-size:11.5px; font-weight:700; opacity:.7; }
.qa-pin{ display:inline-grid; color:var(--butter-d); }

.qa-bname{ font-weight:800; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }

.qa-board{ min-height:132px; }
.qa-board .mbprev{ height:88px; }
@container qa (max-width:820px){
  .home .ftiles.qa-grid{ grid-template-columns:repeat(3, minmax(0,1fr)); }

.adm-h{ display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; margin-bottom:10px; }

.adm-rel-row{ display:grid; grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto; gap:6px 14px; align-items:start; padding:12px 0; border-bottom:1px dashed var(--line); }

/* Supabase email links return to  /?case=confirmed|recovery|oauth&code=…  (or with ?error=…).
   supabase-js swaps the code for a session during Auth.init(); afterwards this tidies the URL
   back to a normal #/ route and says what happened. */
function readAuthCallback() {
  const q = new URLSearchParams(location.search), hq = new URLSearchParams(location.hash.startsWith('#/') ? '' : location.hash.slice(1));
  const kind = q.get('case'), error = q.get('error') || hq.get('error'), code = q.get('error_code') || hq.get('error_code');
  if (!kind && !error && !q.has('code')) return null;
  return { kind, error, code };
}
function finishAuthCallback(cb) {
  if (!cb) return;
  let to = '#/', msg = null;
  if (cb.error) { to = cb.kind === 'recovery' ? '#/forgot-password' : '#/signin'; msg = cb.code === 'otp_expired' ? 'That link has expired or was already used. Please request a new one.' : 'That link didn’t work. Please try again.'; }
  else if (cb.kind === 'recovery') { if (Auth.isSignedIn()) { Auth.recovery = true; to = '#/reset-password'; } else { to = '#/forgot-password'; msg = 'That reset link didn’t work in this browser. Request a new one here.'; } }
  else if (cb.kind === 'confirmed') { if (Auth.isSignedIn()) msg = 'Email confirmed. Welcome to CASE!'; else { to = '#/signin'; msg = 'Your email is confirmed. Sign in to continue.'; } }
  else if (!Auth.isSignedIn()) to = '#/signin';
  try { history.replaceState(null, '', location.pathname + to); } catch (e) { location.hash = to; }
  if (msg) setTimeout(() => toast(msg), 300);
}

<script>
/* ================= router ================= */
/* Intercept clicks on internal (#/...) links ourselves, in the capture phase, before any
   host-page/link-warning handling can treat them as external navigation. Real external
   links (file downloads, pasted moodboard URLs, "Open" buttons) are left completely alone —
   this only touches same-app hash links. */
document.addEventListener('click', e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href]'); if (!a) return;
  if (a.hasAttribute('data-noroute')) return;
  const href = a.getAttribute('href');
  if (!href || !href.startsWith('#/') || a.target === '_blank') return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (location.hash === href) render(); else location.hash = href;
}, true);

const ROUTES = { '': 'home', todo: 'todo', calendar: 'calendar', notes: 'notes', folders: 'folders', moodboard: 'moodboard', settings: 'settings', admin: 'admin',
  /* public area (see auth section) */ welcome: 'welcome', signin: 'signin', signup: 'signup', 'forgot-password': 'forgot', 'reset-password': 'reset' };
const route = { page: 'home', arg: null };
function parseHash() { const raw = location.hash.replace(/^#\/?/, ''); const [p, ...rest] = raw.split('/'); const page = ROUTES[p] !== undefined ? p : ''; return { page: ROUTES[page], arg: rest.length ? decodeURIComponent(rest.join('/')) : null }; }
function go(path) { location.hash = '#/' + path; }
function render() {
  if (mbUnmount) { mbUnmount(); mbUnmount = null; }
  let r = parseHash();
  /* Route guard. Private pages need a session; with none, show the welcome page and remember
     where the visitor was headed. replaceState swaps the URL without adding a history entry
     (so Back doesn't bounce), and without firing hashchange (so no double render). */
  const toHash = to => { try { history.replaceState(null, '', to); } catch (e) { location.hash = to; return false; } r = parseHash(); return true; };
  if (!PUBLIC_PAGES.has(r.page) && !Auth.isSignedIn()) { if (!cameViaHistory()) rememberNext(location.hash || '#/'); if (!toHash('#/welcome')) return; }
  else if ((r.page === 'signin' || r.page === 'signup') && Auth.isSignedIn()) { if (!toHash('#/')) return; }
  /* Admin needs the 'admin.view' permission (see Access). Without it, go Home. UI only: not security. */
  else if (r.page === 'admin' && !Access.can('admin.view')) { if (!toHash('#/')) return; }
  route.page = r.page; route.arg = r.arg;
  if (Auth.isSignedIn()) stampHistory();
  const isPublic = PUBLIC_PAGES.has(r.page);
  document.body.classList.toggle('public', isPublic);
  document.body.dataset.page = r.page;   // per-page accent (CSS: body[data-page=…])
  const main = $('#view');
  let node = isPublic ? null : cloudBlockedView();

      r.page === 'home' ? viewHome() : r.page === 'todo' ? viewTodo() : r.page === 'calendar' ? viewCalendar(r.arg) : r.page === 'notes' ? viewNotes(r.arg) : r.page === 'folders' ? viewFolders(r.arg) : r.page === 'settings' ? viewSettings(r.arg) : r.page === 'admin' ? viewAdmin(r.arg) : viewBoard(r.arg);
  } catch (e) {

  }

  if (!isPublic && meta.autoplayPending) { meta.autoplayPending = false; Ambience.play(get('settings').music.preset); }

async function finishBoot() {
  if (meta.booted) return; meta.booted = true;
  applyTheme();
  $('#boot').classList.add('gone'); setTimeout(() => $('#boot').remove(), 500);
  render(); tmInit(); paintTimer();
  refreshNotifs(); paintNotifBadge();
  if (get('settings').music.autoplay) { if (PUBLIC_PAGES.has(route.page)) meta.autoplayPending = true; else Ambience.play(get('settings').music.preset); }
  setInterval(() => { if (ymd(new Date()) !== (get('profile').focusLog || {}).date) paintTimer(); }, 60000);
  setInterval(refreshNotifs, 5 * 60000);
}
function remoteChanged() { if (meta.booted) { applyTheme(); paintSide(); render(); } }
async function boot() {
  const real = AUTH_CONFIG.mode === 'supabase';
  if (real) LS = null; else loadLocal();       // Supabase: no data until we know who is signed in
  applyTheme();
  const cb = real ? readAuthCallback() : null;
  await Auth.init();
  if (real) useAccountData(Auth.session);
  const roleKnown = Access.refresh();
  if (real) await Promise.race([roleKnown, new Promise(r => setTimeout(r, 5000))]);
  window.addEventListener('beforeunload', flushAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
  if (real) {                                  // Supabase: real sign-in + cloud sync
    meta.assets = null;
    finishAuthCallback(cb);
    cloudListeners();
    if (Auth.session) {
      const first = cloudSync(true);
      if (!have.profile) await Promise.race([first, sleepMs(12000)]);   // new device: wait for the cloud behind the boot screen
    }
    finishBoot(); paintStatus(); return;
  }
  let db = null, user = null, assets = null;
  try { db = await claude.use('db'); } catch (e) { }
  try { user = await claude.use('user'); } catch (e) { }
  if (db) {
    try { assets = await claude.use('assets'); } catch (e) { }
    meta.db = db; meta.mode = 'db';
    try { meta.uid = await user.id(); } catch (e) { meta.uid = null; }
    if (!meta.uid) { meta.mode = 'local'; meta.assets = null; if (Object.keys(have).length) finishBoot(); else { seed(); finishBoot(); } return; }
    meta.assets = assets;
    try { meta.me = await user.me(); } catch (e) { meta.me = null; }
    try {
      meta.db.collection('data/users/' + meta.uid).onSnapshot(onSnap, () => { meta.mode = 'local'; paintStatus(); if (!meta.booted) { if (!Object.keys(have).length) seed(); finishBoot(); } });
      setTimeout(() => { if (!meta.synced) { if (!Object.keys(have).length) seed(); finishBoot(); } }, 6000);
    } catch (e) { meta.mode = 'local'; if (!Object.keys(have).length) seed(); finishBoot(); }
  } else {
    meta.mode = 'local'; meta.assets = null;
    if (!Object.keys(have).length) seed();
    finishBoot();
  }

</script>
<script>
  const menubtn = document.getElementById('menubtn'), scrimnav = document.getElementById('scrimnav');
  menubtn.addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); menubtn.setAttribute('aria-expanded', String(open)); });
  scrimnav.addEventListener('click', () => { document.body.classList.remove('nav-open'); menubtn.setAttribute('aria-expanded', 'false'); });
</script>
</body>
</html>
