<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASE!</title>
<meta name="theme-color" content="#eeece6">
<style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600&display=swap');

:root{
  --paper:#eeece6; --paper2:#f7f5ef; --card:#fffdf8; --ink:#1b1b22; --ink2:#4b4b55; --ink3:#6f6f7a;
  --line:#e1ddd0; --line2:#d6d1c1;
  --blue:#3b6fd4; --blue-d:#2c56ac; --yellow:#f0b429; --yellow-d:#c98f00; --red:#d9483b; --red-d:#b83b30;
  --green:#4a9a56; --purple:#7a5cd6; --orange:#e8833a;
  --radius:16px; --radius-sm:10px; --shadow:0 1px 2px rgba(30,25,10,.05), 0 8px 20px -10px rgba(30,25,10,.15);
  --shadow-lift:0 4px 10px rgba(30,25,10,.08), 0 18px 34px -14px rgba(30,25,10,.24);
  --sidebar-w:236px; --font-head:'Fraunces',Georgia,serif; --font-body:'Nunito Sans',-apple-system,Segoe UI,sans-serif;
  --accent:#3b6fd4; --accent-ink:#fff; --accent-text:#3b6fd4; --solid:#1b1b22; --solid-ink:#fff; --solid-hover:#000;
  color-scheme: light;
}
/* ---------- themes ---------- */
/* Warm cream (default look, explicit) */
html[data-theme="cream"]{ --paper:#f1e7d3; --paper2:#f8f1e2; --card:#fffdf3; --line:#e6d9bd; --line2:#d8c7a2; }
/* Light = same base palette as the default, kept explicit so switching always has a visible target */
html[data-theme="light"]{ --paper:#eeece6; --paper2:#f7f5ef; --card:#fffdf8; --line:#e1ddd0; --line2:#d6d1c1; }
html[data-theme="lavender"]{ --paper:#eae3f7; --paper2:#f4f0fb; --card:#fdfbff; --line:#dccdf0; --line2:#c9b3e6; }
html[data-theme="sage"]{ --paper:#e4ecdf; --paper2:#eef4ea; --card:#fbfdf8; --line:#cfe0c6; --line2:#b9d1ac; }
html[data-theme="blue"]{ --paper:#e2ebf7; --paper2:#eef3fb; --card:#fbfdff; --line:#c9daf0; --line2:#adc8e8; }
html[data-theme="rose"]{ --paper:#f7e6e6; --paper2:#fbf0f0; --card:#fffbfb; --line:#f0cdd1; --line2:#e6b0b7; }
html[data-theme="dark"]{
  --paper:#1c1b19; --paper2:#242220; --card:#2b2926; --ink:#f2efe9; --ink2:#c7c2b8; --ink3:#a39c8f;
  --line:#3a3733; --line2:#4a453f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
  --shadow-lift:0 4px 10px rgba(0,0,0,.35), 0 18px 34px -14px rgba(0,0,0,.6);
  --solid:#f2efe9; --solid-ink:#1c1b19; --solid-hover:#ffffff;
  color-scheme: dark;
}
html[data-theme="dark"] .mb-vp{ background: linear-gradient(#332f2a 1px, transparent 1px) 0 0/28px 28px, linear-gradient(90deg, #332f2a 1px, transparent 1px) 0 0/28px 28px, #262420; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
h1,h2,h3{ font-family:var(--font-head); font-weight:600; margin:0; color:var(--ink); }
button{ font-family:inherit; }
a{ color:inherit; text-decoration:none; }
:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px; }
::selection{ background:#cfe0ff; }
img{ max-width:100%; }
input,textarea,select,button{ font-size:15px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

/* ---------- boot ---------- */
.boot{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; z-index:999; transition:opacity .45s ease; }
.boot.gone{ opacity:0; pointer-events:none; }
.boot-mark{ font-family:var(--font-head); font-style:italic; font-weight:700; font-size:44px; color:var(--ink); animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:.45} 50%{opacity:1} }

/* ---------- shell / sidebar ---------- */
.shell{ display:flex; min-height:100dvh; }
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--paper2); border-right:1.5px solid var(--line);
  display:flex; flex-direction:column; padding:22px 16px calc(16px + env(safe-area-inset-bottom,0px));
  position:sticky; top:0; height:100dvh; padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.brand{ padding:2px 8px 20px; }
.brand-mark{ font-family:var(--font-head); font-style:italic; font-weight:700; font-size:26px; letter-spacing:.2px; }
#nav{ display:flex; flex-direction:column; gap:2px; }
#nav a{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:11px; color:var(--ink2); font-weight:700; font-size:14.5px;
  border:1.5px solid transparent;
}
#nav a svg{ color:var(--c,var(--ink3)); flex:none; }
#nav a:hover{ background:#00000008; }
#nav a[aria-current="page"]{ background:var(--card); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow); }
.side-folders{ margin-top:22px; padding-top:14px; border-top:1.5px solid var(--line); flex:1; min-height:0; overflow:auto; }
.side-folders h2{ font-family:var(--font-body); font-size:11.5px; font-weight:800; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase; padding:0 12px 8px; }
.sf{ display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:9px; font-size:14px; font-weight:600; color:var(--ink2); }
.sf:hover{ background:#00000008; }
.sfi{ width:18px; display:flex; }
.sync{ display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:12px; color:var(--ink3); font-weight:700; }
.sync .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink3); flex:none; }
.sync.ok .dot{ background:var(--green); }
.sync.wait .dot{ background:var(--yellow-d); animation:blink 1s infinite; }
.sync.local .dot{ background:var(--ink3); }
@keyframes blink{ 50%{opacity:.35} }

.navbtn.menu{ display:none; }
.scrim-nav{ display:none; }

main{ flex:1; min-width:0; padding:28px 34px 80px; }

/* ---------- page frame ---------- */
.page{ max-width:1180px; margin:0 auto; }
.page.narrow{ max-width:720px; }
.ptitle{ font-size:30px; margin-bottom:4px; }
.psub{ color:var(--ink3); font-size:14px; margin:0 0 18px; }
.pagehead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.psmall{ color:var(--ink3); font-size:13.5px; margin:0; }
.psmall.foot{ margin-top:14px; }
.muted{ color:var(--ink3); }
.muted.pad{ padding:20px; }

/* ---------- buttons / fields ---------- */
.btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; border:1.5px solid var(--line2); background:var(--card); color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 1px 0 rgba(20,15,5,.03); }
.btn:hover{ background:var(--card); border-color:#c8c2ae; }
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:var(--solid); color:var(--solid-ink); border-color:var(--solid); }
.btn.primary:hover{ background:var(--solid-hover); }
.btn.danger{ background:#fdf1ef; border-color:#f2c9c2; color:var(--red-d); }
.btn.danger:hover{ background:#fbe4e0; }
.btn.ghost{ background:transparent; border-color:transparent; box-shadow:none; }
.btn.ghost:hover{ background:#00000008; }
.btn.sm{ padding:6px 11px; font-size:13px; border-radius:8px; }
.btn.wide{ width:100%; justify-content:center; }
.btn[disabled]{ opacity:.5; cursor:default; pointer-events:none; }
.linkbtn{ background:none; border:none; padding:0; color:var(--accent-text); font-weight:700; cursor:pointer; font-size:inherit; text-decoration:underline; text-underline-offset:2px; }
.iconbtn{ width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:9px; border:1.5px solid transparent; background:none; color:var(--ink2); cursor:pointer; }
.iconbtn:hover{ background:#00000008; }
.iconbtn.on{ color:var(--yellow-d); background:#fdf3d9; }
.field{ width:100%; padding:10px 13px; border-radius:10px; border:1.5px solid var(--line2); background:var(--card); color:var(--ink); }
.field:focus-visible{ border-color:var(--accent); }
.field.big{ font-size:16px; padding:12px 14px; }
.field.date{ max-width:150px; }
.flabel{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:800; color:var(--ink3); text-transform:none; }
.pform{ display:flex; flex-direction:column; gap:14px; }
.pform .two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.prow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sp{ flex:1; }

.swatches{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
.swatches.sm .sw{ width:24px; height:24px; }
.sw{ width:30px; height:30px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--line2); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; }
.sw.on{ box-shadow:0 0 0 2px var(--ink); }
.colorin{ width:40px; height:32px; border:1.5px solid var(--line2); border-radius:8px; padding:2px; background:var(--card); }
.colorlab{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color:var(--ink3); }
.seg{ display:inline-flex; border:1.5px solid var(--line2); border-radius:10px; overflow:hidden; background:var(--card); }
.seg button{ border:none; background:none; padding:8px 14px; font-weight:700; font-size:13.5px; color:var(--ink2); cursor:pointer; border-right:1.5px solid var(--line2); }
.seg button:last-child{ border-right:none; }
.seg button[aria-pressed="true"]{ background:var(--solid); color:var(--solid-ink); }
.seg.sm button{ padding:5px 12px; font-size:12.5px; }
.seg button b{ font-weight:800; }

/* ---------- toast / modal ---------- */
.toastbox{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:900; padding-bottom:env(safe-area-inset-bottom,0px); }
.toast{ background:var(--solid); color:var(--solid-ink); padding:11px 18px; border-radius:11px; font-size:13.5px; font-weight:700; box-shadow:var(--shadow-lift); animation:toastin .25s ease; }
.toast.err{ background:var(--red-d); }
@keyframes toastin{ from{opacity:0; transform:translateY(8px)} }
.scrim{ position:fixed; inset:0; background:rgba(20,17,10,.4); display:flex; align-items:center; justify-content:center; z-index:800; padding:20px; }
.modal{ background:var(--card); border-radius:18px; padding:26px; width:100%; max-width:420px; box-shadow:var(--shadow-lift); max-height:88vh; overflow:auto; }
.modal.wide{ max-width:520px; }
.mtitle{ font-size:20px; margin-bottom:16px; }
.mtext{ color:var(--ink2); margin:0 0 4px; line-height:1.5; }
.mactions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

/* ---------- home ---------- */
.home{ display:flex; flex-direction:column; gap:0; }
.banner{ border-radius:20px; overflow:hidden; height:150px; box-shadow:var(--shadow); }
.banner-art{ width:100%; height:100%; background-size:cover; background-position:center; }
.banner-art svg{ width:100%; height:100%; display:block; }
.ident{ display:flex; align-items:center; gap:16px; margin-top:-38px; margin-left:22px; margin-bottom:20px; position:relative; z-index:2; }
.avatar{ width:84px; height:84px; border-radius:50%; padding:0; border:4px solid var(--paper); background:var(--card); overflow:hidden; cursor:pointer; box-shadow:var(--shadow); flex:none; }
.avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.hello{ padding-top:38px; }
.hello h1{ font-size:23px; }
.hello p{ margin:2px 0 0; color:var(--ink3); font-size:13.5px; }
.home-grid{ display:grid; grid-template-columns:280px 1fr 280px; gap:20px; align-items:start; }
.col{ display:flex; flex-direction:column; gap:20px; min-width:0; }

.card{ background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
.wtitle{ font-size:16.5px; margin-bottom:12px; }

/* todo widget */
.paper{ display:flex; flex-direction:column; }
.trow{ display:flex; align-items:center; gap:9px; padding:7px 2px; border-bottom:1px dashed var(--line); min-height:38px; }
.trow.blank{ border-bottom:1px dashed var(--line); }
.trow:last-child{ border-bottom:none; }
.trow.is-done .ttext{ color:var(--ink3); text-decoration:line-through; }
.cb{ width:19px; height:19px; border-radius:6px; border:1.7px solid var(--line2); background:var(--card); display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; flex:none; }
.cb.on{ background:var(--green); border-color:var(--green); }
.cb.ghost{ visibility:hidden; }
.ttext{ flex:1; text-align:left; background:none; border:none; padding:2px 0; color:var(--ink); font-size:14.5px; cursor:text; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tinput{ flex:1; border:1.5px solid var(--blue); border-radius:7px; padding:5px 8px; font-size:14.5px; background:var(--card); }
.tinput.new{ border-color:var(--line2); }
.due{ font-size:11.5px; color:var(--ink3); font-weight:700; flex:none; }
.due.late{ color:var(--red-d); }
.star{ background:none; border:none; padding:2px; cursor:pointer; flex:none; display:flex; }
.star.lg{ padding:6px; }
.tdel{ background:none; border:none; padding:4px; color:var(--ink3); cursor:pointer; flex:none; opacity:0; }
.trow:hover .tdel, .trow:focus-within .tdel{ opacity:1; }
.tdel:hover{ color:var(--red-d); }
.hint{ color:var(--ink3); font-size:13px; padding:4px 0; }
.hint.c{ text-align:center; padding:30px 10px; }
.plusbtn{ width:30px; height:30px; border-radius:9px; border:1.5px solid var(--line2); background:var(--card); color:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
.plusbtn:hover{ background:var(--paper2); }
.todo-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:10px; }
.more{ font-size:12.5px; font-weight:800; color:var(--accent-text); }
.addcard{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.addcard .field.big{ flex:1; min-width:180px; }
.tbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.streakline{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--ink2); }
.streakline svg{ display:block; }
.paperwrap{ padding:8px 14px; }
.tfoot{ margin-top:12px; }

/* streak card */
.streak{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:10px; padding:14px 16px; }
.streak svg{ width:34px; height:auto; flex:none; }
.streak-num{ font-family:var(--font-head); font-size:24px; font-weight:700; color:var(--ink); line-height:1; margin-top:0; }
.streak-cap{ font-size:12px; color:var(--ink3); font-weight:700; text-align:left; }

/* index tabs (center) */
.idx{ display:flex; flex-direction:column; gap:0; }
.idx-tabs{ display:flex; gap:6px; margin-bottom:12px; }
.idxtab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 8px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper2); color:var(--ink2); font-weight:700; font-size:12.5px; cursor:pointer; }
.idxtab .tabic{ color:var(--tc); }
.idxtab[aria-selected="true"]{ background:var(--card); border-color:var(--ink); color:var(--ink); box-shadow:var(--shadow); }
.idxpanel{ flex:1; display:flex; flex-direction:column; }
.ptools{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
.ftiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.ftile{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:14px; border:1.5px solid var(--line); background:var(--paper2); text-align:center; }
.ftile:hover{ background:var(--card); box-shadow:var(--shadow); }
.ftile.dashed{ border-style:dashed; background:none; color:var(--ink3); cursor:pointer; justify-content:center; }
.fico{ width:52px; height:52px; }
.fico.plus{ display:flex; align-items:center; justify-content:center; }
.fname{ font-weight:700; font-size:13px; color:var(--ink); word-break:break-word; }
.ncards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ncard{ background:var(--nc); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:4px; min-height:78px; box-shadow:0 2px 6px rgba(20,15,5,.06); }
.ncard strong{ font-size:13.5px; }
.ncard span{ font-size:12px; color:#3a3a2e; opacity:.75; line-height:1.35; }
.ncard.dashed{ background:var(--paper2); border:1.5px dashed var(--line2); align-items:center; justify-content:center; color:var(--ink3); cursor:pointer; box-shadow:none; }
.mbprev-link{ display:block; border-radius:12px; overflow:hidden; }
.mbprev{ position:relative; height:150px; border-radius:12px; background:#e9e5d8; overflow:hidden; border:1.5px solid var(--line); }
.mbprev-in{ position:absolute; inset:0; transform-origin:0 0; pointer-events:none; }
.mbprev .hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:14px; }
.empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:34px 14px; color:var(--ink3); }
.empty h2{ font-size:17px; color:var(--ink); margin-top:6px; }
.empty p{ margin:0; max-width:340px; font-size:13.5px; }
.empty .btn{ margin-top:10px; }
.empty.span{ grid-column:1/-1; }

/* timer */
.timer{ display:flex; flex-direction:column; gap:12px; }
.tm-top{ display:flex; align-items:center; gap:10px; }
.tm-plant{ width:58px; height:64px; flex:none; }
.tm-plant svg{ width:100%; height:100%; }
.lf{ opacity:.18; transition:opacity .5s ease; }
.lf.on{ opacity:1; }
.tm-modes{ flex:1; display:flex; flex-direction:column; gap:5px; }
.tm-mode{ text-align:left; border:none; background:none; padding:5px 10px; border-radius:8px; font-weight:800; font-size:12.5px; color:var(--ink3); cursor:pointer; }
.tm-mode.m0[aria-pressed="true"]{ background:#eaf3ea; color:var(--green); }
.tm-mode.m1[aria-pressed="true"]{ background:#efeafd; color:var(--purple); }
.tm-mode.m2[aria-pressed="true"]{ background:#fdeeea; color:var(--red-d); }
.tm-mid{ display:flex; align-items:center; justify-content:center; gap:12px; }
.tm-step{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line2); background:var(--card); color:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
.tm-read{ display:flex; flex-direction:column; align-items:center; min-width:110px; }
.tm-time{ font-family:var(--font-head); font-size:38px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
.tm-len{ font-size:11px; color:var(--ink3); font-weight:700; margin-top:2px; }
.tm-btns{ display:flex; gap:8px; }
.tm-toggle{ flex:1; justify-content:center; }
.tm-log{ text-align:center; font-size:12px; color:var(--ink3); margin:0; }

/* mini calendar */
.minical{ padding:16px; }
.mc-head{ display:flex; flex-direction:column; margin-bottom:10px; }
.mc-date{ font-family:var(--font-head); font-size:16px; font-weight:600; }
.mc-day{ font-size:12px; color:var(--ink3); }
.mc-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.mc-w{ text-align:center; font-size:10px; color:var(--ink3); font-weight:800; padding-bottom:3px; }
.mc-d{ position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:7px; font-size:11.5px; color:var(--ink2); }
.mc-d:hover{ background:var(--paper2); }
.mc-d.out{ color:#cfcabb; }
.mc-d.today{ background:var(--solid); color:var(--solid-ink); font-weight:800; }
.mc-d i{ position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; }

/* ---------- to-do page tweaks ---------- */
.tinput{ }

/* ---------- calendar page ---------- */
.page.wide{ max-width:1280px; }
.cal-layout{ display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start; }
.cal-main{ padding:18px; }
.cal-head{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:14px; }
.cal-title{ text-align:center; font-size:22px; }
.cal-nav{ display:flex; gap:4px; }
.todaybtn{ justify-self:end; border:1.5px solid var(--line2); background:var(--card); padding:7px 13px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer; }
.todaybtn:hover{ background:var(--paper2); }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-wd{ text-align:center; font-size:11.5px; font-weight:800; color:var(--ink3); padding-bottom:4px; }
.cell{ text-align:left; min-height:96px; border-radius:11px; border:1.5px solid var(--line); background:var(--paper2); padding:6px; display:flex; flex-direction:column; gap:3px; cursor:pointer; font-family:inherit; overflow:hidden; }
.cell:hover{ background:var(--card); }
.cell.out{ opacity:.45; }
.cell.today{ border-color:var(--ink); }
.cell.today .num{ background:var(--solid); color:var(--solid-ink); }
.cell.sel{ box-shadow:0 0 0 2px var(--blue) inset; background:var(--card); }
.cell .num{ font-size:12px; font-weight:800; width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
.chip{ font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.more-n{ font-size:10px; color:var(--ink3); font-weight:700; padding-left:2px; }
.taskdot{ font-size:9.5px; font-weight:800; color:var(--yellow-d); }
.dots{ display:none; }
.cal-side{ display:flex; flex-direction:column; gap:4px; position:sticky; top:20px; }
.side-date{ font-size:17px; margin-bottom:12px; }
.sh{ font-size:11.5px; font-weight:800; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; margin:14px 0 6px; }
.evlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.evrow{ display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none; padding:7px 6px; border-radius:9px; cursor:pointer; font-family:inherit; }
.evrow:hover{ background:var(--paper2); }
.evrow i{ width:9px; height:9px; border-radius:50%; flex:none; }
.evt{ flex:1; font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.evtime{ font-size:11.5px; color:var(--ink3); font-weight:700; flex:none; }
.taskrow{ display:flex; align-items:center; gap:9px; padding:5px 6px; font-size:13.5px; cursor:pointer; }
.taskrow .done{ color:var(--ink3); text-decoration:line-through; }

/* ---------- notes page ---------- */
.notes-layout{ display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start; }
.nlist{ padding:14px; display:flex; flex-direction:column; gap:10px; max-height:calc(100dvh - 130px); position:sticky; top:20px; }
.nl-top{ display:flex; gap:8px; }
.nl-top .field{ flex:1; }
.nl-items{ overflow:auto; display:flex; flex-direction:column; gap:2px; margin:0 -6px; }
.nitem{ display:flex; flex-direction:column; gap:2px; padding:9px 10px; border-radius:10px; border-left:4px solid var(--nc); }
.nitem:hover{ background:var(--paper2); }
.nitem[aria-current="true"]{ background:var(--card); box-shadow:var(--shadow); }
.nt{ font-weight:800; font-size:13.5px; display:flex; align-items:center; gap:5px; color:var(--yellow-d); }
.nitem .nt{ color:var(--ink); }
.nb{ font-size:12px; color:var(--ink3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nm{ font-size:10.5px; color:#b6b2a1; }
.neditor{ min-height:520px; display:flex; flex-direction:column; border-top:5px solid var(--nc,var(--yellow)); }
.ehead{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.backbtn{ display:none; }
.ntitle{ border:none; background:none; font-family:var(--font-head); font-size:25px; font-weight:600; padding:4px 2px; }
.nbody{ flex:1; border:none; background:none; resize:none; font-size:15px; line-height:1.85; padding:6px 2px; min-height:340px; font-family:var(--font-body); }
.nbody.lined{ background-image:repeating-linear-gradient(transparent, transparent 43px, var(--line) 44px); background-attachment:local; }
.efoot{ border-top:1px dashed var(--line); padding-top:10px; margin-top:8px; }
.nmeta{ font-size:11.5px; color:var(--ink3); font-weight:700; }

/* ---------- folders page ---------- */
.crumbs{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink3); margin-bottom:10px; flex-wrap:wrap; }
.crumbs a:hover{ color:var(--ink); text-decoration:underline; }
.crumbs [aria-current]{ color:var(--ink); }
.fgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; border-radius:16px; transition:background .12s; }
.fgrid.drop{ background:#eaf1ff; outline:2px dashed var(--blue); outline-offset:6px; }
.tile{ position:relative; }
.ftile.big{ padding:20px 10px 14px; gap:10px; }
.ftile.big .fico{ width:60px; height:60px; }
.ftile.big .fico.thumb{ display:flex; align-items:center; justify-content:center; border-radius:10px; overflow:hidden; color:var(--ink3); background:var(--card); }
.ftile.big .fico.thumb img{ width:100%; height:100%; object-fit:cover; }
.fmeta{ font-size:11px; color:var(--ink3); }
.tacts{ position:absolute; top:8px; right:8px; display:flex; gap:4px; opacity:0; }
.tile:hover .tacts, .tile:focus-within .tacts{ opacity:1; }
.tact{ width:26px; height:26px; border-radius:7px; border:1.5px solid var(--line2); background:var(--card); color:var(--ink2); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.tact:hover{ background:var(--paper2); }
.bigdrawer{ width:110px; height:110px; }

/* ---------- moodboard ---------- */
.mb-page .pagehead{ align-items:center; }
.mb-boards{ display:flex; gap:6px; flex-wrap:wrap; }
.bchip{ padding:7px 13px; border-radius:20px; border:1.5px solid var(--line2); background:var(--card); font-weight:700; font-size:12.5px; color:var(--ink2); cursor:pointer; }
.bchip[aria-current]{ background:var(--solid); color:var(--solid-ink); border-color:var(--solid); }
.bchip.add{ display:flex; align-items:center; gap:5px; background:var(--paper2); border-style:dashed; }
.mb-tools{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:12px; padding:10px 14px; position:sticky; top:0; z-index:5; }
.tgroup{ display:flex; align-items:center; gap:7px; }
.tgroup.zoom{ gap:4px; }
.zlabel{ font-size:12px; font-weight:800; color:var(--ink3); width:42px; text-align:center; }
.mb-ctx{ min-height:20px; display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.mb-vp{ position:relative; height:min(64vh,620px); overflow:auto; border-radius:16px; border:1.5px solid var(--line); background:
    linear-gradient(#e9e5d8 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, #e9e5d8 1px, transparent 1px) 0 0/28px 28px, #f1efe6;
}
.mb-sizer{ position:relative; }
.mb-world{ position:absolute; left:0; top:0; width:3200px; height:2000px; transform-origin:0 0; }
.mbi{ position:absolute; cursor:grab; border-radius:8px; touch-action:none; }
.mbi:active{ cursor:grabbing; }
.mbi.sel{ box-shadow:0 0 0 2.5px var(--blue), var(--shadow-lift); }
.mbi:not(.sel){ box-shadow:var(--shadow); }
.mbi-note{ padding:10px; display:flex; }
.mbi-note .mbi-ta{ width:100%; height:100%; border:none; background:none; resize:none; font-size:13.5px; line-height:1.4; color:#332; font-family:var(--font-body); }
.mbi-image{ overflow:hidden; background:#e2ded0; }
.mbi-image img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.mbi-image.broken{ display:flex; align-items:center; justify-content:center; color:var(--ink3); font-size:11px; }
.mbi-swatch{ display:flex; align-items:flex-end; padding:8px; border-radius:8px; }
.swl{ font-size:11px; font-weight:800; letter-spacing:.03em; }
.mbi-text{ background:transparent; box-shadow:none !important; }
.mbi-txt{ width:100%; border:none; background:none; resize:none; font-family:var(--font-head); font-weight:600; color:var(--ink); overflow:hidden; padding:0; }
.grip{ position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:rgba(0,0,0,.12); }
.mbi-rs{ position:absolute; right:-4px; bottom:-4px; width:16px; height:16px; cursor:nwse-resize; }
.mbi-rs::after{ content:''; position:absolute; right:4px; bottom:4px; width:8px; height:8px; border-right:2.5px solid rgba(0,0,0,.35); border-bottom:2.5px solid rgba(0,0,0,.35); border-radius:0 0 2px 0; }
.mbi-text .mbi-rs::after{ border-color:rgba(0,0,0,.2); }

/* ---------- floating focus pill ---------- */
.tpill{ position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:120; }
.tpill-in{ display:flex; align-items:center; gap:8px; background:var(--solid); color:var(--solid-ink); padding:10px 16px; border-radius:30px; font-weight:800; font-size:13px; box-shadow:var(--shadow-lift); font-variant-numeric:tabular-nums; }
.tpill-in::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--red); }

/* ---------- sidebar footer / notifications ---------- */
.sidefoot{ display:flex; flex-direction:column; gap:2px; padding-top:8px; }
.sfoot-btn{ display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:11px; color:var(--ink2); font-weight:700; font-size:14px; background:none; border:none; cursor:pointer; text-align:left; width:100%; font-family:inherit; position:relative; }
.sfoot-btn:hover{ background:#00000008; }
.sfoot-btn[aria-current="page"]{ background:var(--card); border:1.5px solid var(--line); box-shadow:var(--shadow); color:var(--ink); }
.notif-badge{ margin-left:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:800; min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
.notif-badge[hidden]{ display:none; }
.notiflist{ display:flex; flex-direction:column; gap:2px; max-height:60vh; overflow:auto; }
.notifrow{ padding:11px 6px; border-bottom:1px dashed var(--line); }
.notifrow:last-child{ border-bottom:none; }
.notifrow.unread{ background:color-mix(in srgb, var(--accent) 6%, transparent); border-radius:8px; }
.notifrow strong{ font-size:13.5px; display:block; }
.notifrow p{ margin:2px 0; font-size:12.5px; color:var(--ink2); }
.nwhen{ font-size:11px; color:var(--ink3); font-weight:700; }

/* ---------- kebab context menu ---------- */
.kmenu{ position:relative; }
.kmenu-pop{ position:absolute; top:calc(100% + 4px); right:0; background:var(--card); border:1.5px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lift); min-width:170px; padding:6px; z-index:30; display:flex; flex-direction:column; gap:1px; }
.kmenu-pop button{ display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; border:none; background:none; font-size:13.5px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; font-family:inherit; }
.kmenu-pop button:hover{ background:var(--paper2); }
.kmenu-pop button.danger{ color:var(--red-d); }
.kmenu-pop hr{ border:none; border-top:1px solid var(--line); margin:4px 2px; }
.fav-badge{ position:absolute; top:10px; right:10px; color:var(--yellow-d); }
.fdesc{ font-size:11.5px; color:var(--ink3); line-height:1.3; padding:0 4px; }

/* ---------- folder toolbar ---------- */
.ftoolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:16px; }
.ftoolbar > .field{ max-width:240px; }
.seg.wrap{ flex-wrap:wrap; height:auto; }
.sortrow{ display:flex; align-items:center; gap:4px; margin-left:auto; }
.sortsel{ width:auto; padding:8px 30px 8px 12px; font-size:13px; font-weight:700; }

/* ---------- priority pill / icon ---------- */
.prio-ic{ display:flex; }
.prio-pill{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px 2px 6px; border-radius:20px; background:color-mix(in srgb, var(--pc) 16%, var(--card)); color:var(--pc); font-size:10.5px; font-weight:800; flex:none; }
.prio-pill svg{ display:block; }
.prio-seg{ flex-wrap:wrap; height:auto; }
.tbar-filters{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }

/* ---------- toggle switch ---------- */
.togstack{ display:flex; flex-direction:column; gap:4px; }
.togrow{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 2px; border-bottom:1px dashed var(--line); }
.togrow:last-child{ border-bottom:none; }
.togrow b{ font-size:13.5px; font-weight:700; display:block; }
.togrow small{ display:block; font-size:11.5px; color:var(--ink3); font-weight:600; margin-top:1px; }
.toggle{ position:relative; flex:none; width:42px; height:25px; display:inline-block; }
.toggle input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
.tog-track{ position:absolute; inset:0; background:var(--line2); border-radius:14px; transition:background .15s; }
.tog-track::after{ content:''; position:absolute; top:2.5px; left:2.5px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .15s; }
.toggle input:checked + .tog-track{ background:var(--accent); }
.toggle input:checked + .tog-track::after{ transform:translateX(17px); }
.toggle input:focus-visible + .tog-track{ outline:2.5px solid var(--accent); outline-offset:2px; }

/* ---------- settings page ---------- */
.settings-layout{ display:grid; grid-template-columns:200px 1fr; gap:24px; align-items:start; }
.set-nav{ display:flex; flex-direction:column; gap:2px; position:sticky; top:20px; }
.set-nav a{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px; font-weight:700; font-size:13.5px; color:var(--ink2); }
.set-nav a:hover{ background:var(--paper2); }
.set-nav a[aria-current="page"]{ background:var(--card); border:1.5px solid var(--line); box-shadow:var(--shadow); color:var(--ink); }
.set-stack{ display:flex; flex-direction:column; gap:16px; max-width:640px; }
.settle{ padding:22px; }
.set-h{ font-size:17px; margin-bottom:12px; }
.prow.top{ align-items:center; margin-bottom:16px; }
.avatar.lg{ width:64px; height:64px; }
.kv{ display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
.kv:last-child{ border-bottom:none; }
.kv span:first-child{ color:var(--ink3); font-weight:700; }
.kv span:last-child{ font-weight:600; text-align:right; }

.theme-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-bottom:14px; }
.theme-opt{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper2); font-size:12px; font-weight:700; color:var(--ink2); cursor:pointer; }
.theme-opt.on{ border-color:var(--ink); background:var(--card); color:var(--ink); }
.theme-sw{ width:100%; height:36px; border-radius:8px; border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center; color:var(--ink); }

.svc-list{ display:flex; flex-direction:column; gap:2px; }
.svc-row{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px dashed var(--line); }
.svc-row:last-child{ border-bottom:none; }
.svc-ic{ color:var(--ink2); flex:none; }
.svc-n{ font-weight:700; font-size:13.5px; flex:1; }
.svc-state{ font-size:11.5px; font-weight:800; color:var(--ink3); }
.svc-state.on{ color:var(--green); }

/* ---------- music / ambience widget ---------- */
.music{ display:flex; flex-direction:column; gap:10px; }
.music-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.music-head .wtitle{ display:flex; align-items:center; gap:7px; margin:0; }
.music-now{ font-size:11.5px; color:var(--ink3); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }
.music-presets{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.music-preset{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:9px; border:1.5px solid var(--line); background:var(--paper2); cursor:pointer; }
.music-preset.on{ background:color-mix(in srgb, var(--accent) 14%, var(--card)); border-color:var(--accent); }
.mp-ic{ font-size:16px; line-height:1; }
.mp-n{ font-size:9.5px; font-weight:700; color:var(--ink2); }
.music-controls{ display:flex; align-items:center; gap:8px; }
.music-vol{ flex:1; accent-color:var(--accent); }
.music-toggle{ flex:none; padding:8px 10px; }
.music-connect{ font-size:11px; }
.music.compact{ padding:14px 16px; gap:8px; }
.music.compact .music-presets{ display:none; }
.music.compact .music-select{ width:100%; padding:7px 9px; border-radius:9px; border:1.5px solid var(--line2); background:var(--card); font-size:12.5px; font-weight:700; }
.music.compact .music-head{ margin-bottom:0; }
.music.compact .music-controls{ gap:6px; }

/* ---------- rich text toolbar (notes) ---------- */
.rt-toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:2px; padding:6px; margin:2px 0 8px; border:1.5px solid var(--line); border-radius:11px; background:var(--paper2); position:relative; }
.rt-btn{ width:31px; height:31px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:none; background:none; color:var(--ink2); cursor:pointer; flex:none; }
.rt-btn:hover{ background:var(--card); color:var(--ink); }
.rt-sep{ width:1px; height:20px; background:var(--line2); margin:0 3px; flex:none; }
.rt-select{ border:1.5px solid var(--line2); background:var(--card); border-radius:8px; padding:5px 6px; font-size:12px; font-weight:700; color:var(--ink2); max-width:112px; }
.toolbar-pop{ position:absolute; top:calc(100% + 4px); left:0; padding:8px; display:flex; flex-wrap:wrap; gap:6px; width:150px; }
.colordot{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line2); cursor:pointer; }
.colordot.none{ background-image:linear-gradient(45deg, transparent 45%, var(--red) 45%, var(--red) 55%, transparent 55%); }
.nbody.rich{ min-height:340px; outline:none; font-size:15px; line-height:1.85; padding:6px 2px; }
.nbody.rich:empty::before{ content:attr(data-placeholder); color:var(--ink3); }
.nbody.rich h1{ font-family:var(--font-head); font-size:26px; margin:.6em 0 .3em; }
.nbody.rich h2{ font-family:var(--font-head); font-size:21px; margin:.6em 0 .3em; }
.nbody.rich h3{ font-family:var(--font-head); font-size:18px; margin:.5em 0 .3em; }
.nbody.rich p{ margin:0 0 .8em; }
.nbody.rich blockquote{ margin:.6em 0; padding:2px 16px; border-left:3px solid var(--accent); color:var(--ink2); font-style:italic; }
.nbody.rich pre{ background:var(--paper2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; overflow-x:auto; margin:.6em 0; }
.nbody.rich ul,.nbody.rich ol{ padding-left:1.4em; margin:0 0 .8em; }
.nbody.rich a{ color:var(--accent-text); text-decoration:underline; }
.nbody.rich hr{ border:none; border-top:1.5px dashed var(--line2); margin:1.2em 0; }
.nbody.rich .rt-check{ list-style:none; padding-left:0; }
.nbody.rich .rt-check li{ display:flex; align-items:flex-start; gap:8px; margin-bottom:4px; }
.nbody.rich .rt-check input{ margin-top:5px; accent-color:var(--accent); cursor:pointer; }
.save-status{ font-size:11.5px; font-weight:800; }
.save-status.saving{ color:var(--yellow-d); }
.save-status.saved{ color:var(--green); }
.save-status.err{ color:var(--red-d); }

/* ---------- music mini pill (mirrors focus pill) ---------- */
.mpill{ position:fixed; left:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:120; }
.mpill-in{ display:flex; align-items:center; gap:8px; background:var(--card); color:var(--ink); border:1.5px solid var(--line2); padding:9px 15px; border-radius:30px; font-weight:800; font-size:13px; box-shadow:var(--shadow-lift); cursor:pointer; }
.mpill-in i{ font-style:normal; opacity:.6; }

/* ---------- home dashboard row 2 (streak / music / calendar) ---------- */
.home-row2{ display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; align-items:start; }
.home-row2 > *{ flex:1 1 220px; min-width:0; }
.home-row2 .streak{ justify-content:center; }
.home-row2 .minical{ padding:14px; }

/* ---------- settings panel wrapper ---------- */
.set-panel{ min-width:0; }

/* ---------- moodboard: collapsible board list ---------- */
.mb-boards{ background:var(--card); border:1.5px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; }
.mb-list-toggle{ display:flex; align-items:center; gap:9px; width:100%; padding:11px 14px; background:none; border:none; cursor:pointer; font-family:inherit; text-align:left; }
.mb-list-toggle:hover{ background:var(--paper2); }
.mb-list-chev{ display:flex; color:var(--ink3); transition:transform .18s ease; transform:rotate(90deg); }
.mb-list-toggle span:nth-child(2){ font-weight:800; font-size:12.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:.04em; }
.mb-list-count{ background:var(--paper2); color:var(--ink3); font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:10px; }
.mb-boards-body{ display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 12px; transition:grid-template-rows .2s ease; }
.mb-boards.collapsed .mb-boards-body{ display:none; }
.mb-boards.collapsed .mb-list-chev{ transform:rotate(0deg); }
.mb-list-current{ display:block; padding:0 14px 11px; font-size:12.5px; font-weight:700; color:var(--ink2); margin-top:-4px; }
.mb-boards.collapsed .mb-list-toggle{ padding-bottom:11px; }

/* ---------- moodboard: link cards ---------- */
.mbi-link{ background:var(--card); border:1.5px solid var(--line); padding:12px; display:flex; flex-direction:column; gap:6px; }
.mbi-linktop{ display:flex; align-items:center; gap:6px; color:var(--accent-text); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; }
.mbi-linkhost{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mbi-linktitle{ border:none; background:none; font-weight:700; font-size:14px; color:var(--ink); padding:0; font-family:inherit; }
.mbi-linktitle.static{ line-height:1.3; }
.mbi-linkopen{ margin-top:auto; align-self:flex-start; display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800; color:var(--accent-text); }

/* ---------- moodboard: image frame / caption / rotate ---------- */
.mbi-image{ background:transparent; box-shadow:none !important; display:flex; flex-direction:column; gap:5px; }
.mbi-image.sel{ box-shadow:none !important; }
.mbi-imgframe{ flex:1; overflow:hidden; background:#e2ded0; box-shadow:var(--shadow); min-height:0; }
.mbi-image.sel .mbi-imgframe{ box-shadow:0 0 0 2.5px var(--accent), var(--shadow-lift); }
.mbi-imgframe img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.mbi-image.broken .mbi-imgframe{ display:flex; align-items:center; justify-content:center; color:var(--ink3); font-size:11px; }
.mbi-cap{ border:none; background:rgba(255,255,255,.85); border-radius:6px; padding:4px 7px; font-size:11.5px; color:#332; font-family:inherit; flex:none; }
.mbi-cap.static{ padding:0 2px; font-size:11.5px; color:var(--ink2); }
.mbi-rot{ position:absolute; top:-26px; left:50%; transform:translateX(-50%); width:22px; height:22px; border-radius:50%; background:var(--card); border:1.5px solid var(--line2); display:none; align-items:center; justify-content:center; cursor:grab; color:var(--ink2); box-shadow:var(--shadow); }
.mbi.sel .mbi-rot{ display:flex; }

/* ---------- moodboard: arrows ---------- */
.mb-arrows{ position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
.mb-arrows .arrow-hit{ pointer-events:stroke; cursor:pointer; }
.mb-arrows .arrow-h{ pointer-events:all; cursor:grab; }
.mb-arrows g.sel .arrow-line{ filter:drop-shadow(0 0 0 transparent); }
.mb-arrows g.sel .arrow-hit{ stroke:color-mix(in srgb, var(--accent) 22%, transparent); }

/* ---------- moodboard: context toolbar extras ---------- */
.mb-range{ width:80px; accent-color:var(--accent); vertical-align:middle; }
.ctx-mini{ display:inline-flex; align-items:center; gap:6px; color:var(--ink3); }
.btn.sm.on{ background:color-mix(in srgb, var(--accent) 14%, var(--card)); border-color:var(--accent); color:var(--accent); }
.mb-tools .iconbtn.on{ color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }

/* ---------- bulk selection ---------- */
.bulkbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--paper2); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; margin-bottom:10px; }
.bulkcount{ font-size:13px; font-weight:800; color:var(--ink2); }
.tile-cb{ position:absolute; top:8px; left:8px; z-index:3; width:20px; height:20px; display:flex; }
.tile-cb input{ width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }
.nitem-cb{ position:absolute; left:8px; top:12px; accent-color:var(--accent); cursor:pointer; }
.nitem{ position:relative; }
.nitem.picked{ background:color-mix(in srgb, var(--accent) 10%, transparent); box-shadow:0 0 0 1.5px var(--accent) inset; }
.tile.has-cb .ftile{ padding-left:34px; }
.ftile.picked{ box-shadow:0 0 0 2px var(--accent) inset; background:var(--card); }
.tile{ position:relative; }

/* ---------- drag and drop ---------- */
.sf.drop-target, .ftile.big.drop-target{ background:color-mix(in srgb, var(--accent) 16%, var(--card)) !important; outline:2px dashed var(--accent); outline-offset:-2px; }
.ftile.big[draggable="true"]{ cursor:grab; }
.ftile.big[draggable="true"]:active{ cursor:grabbing; }

/* ---------- folder picker (move-to-folder modal) ---------- */
.fpick-list{ display:flex; flex-direction:column; gap:2px; max-height:50vh; overflow:auto; }
.fpick-row{ display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:9px; border:none; background:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; }
.fpick-row:hover{ background:var(--paper2); }

/* ---------- image cropper ---------- */
.crop-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.crop-stage{ position:relative; overflow:hidden; border-radius:12px; background:#111; touch-action:none; cursor:grab; box-shadow:var(--shadow); }
.crop-stage:active{ cursor:grabbing; }
.crop-img{ position:absolute; left:0; top:0; max-width:none; will-change:transform; user-select:none; -webkit-user-drag:none; }
.crop-frame{ position:absolute; inset:0; border:2px solid rgba(255,255,255,.85); border-radius:12px; pointer-events:none; box-shadow:0 0 0 2000px rgba(0,0,0,.0); }
.crop-frame.round{ border-radius:50%; }
.crop-zoomrow{ display:flex; align-items:center; gap:10px; width:100%; color:var(--ink3); }
.crop-zoom{ flex:1; accent-color:var(--accent); }

/* ---------- pen tool ---------- */
.mb-vp.pen-mode{ cursor:crosshair; }
.mb-vp.pen-mode .mbi{ pointer-events:none; }
.mb-pen-live{ position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
.pen-opts{ padding:8px 0 0; border-top:1px dashed var(--line); margin-top:8px; align-items:center; }
.tgroup.pen-opts[hidden]{ display:none; }
.btn.on{ background:color-mix(in srgb, var(--accent) 16%, var(--card)); border-color:var(--accent); color:var(--accent); }

/* ---------- to-do: folder/recur/progress meta ---------- */
.trow-main{ flex:1; display:flex; flex-direction:column; min-width:0; gap:1px; }
.trow-meta{ display:flex; gap:6px; flex-wrap:wrap; }
.folder-pill,.recur-pill{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; padding:1px 7px 1px 5px; border-radius:20px; color:var(--ink3); background:var(--paper2); flex:none; }
.folder-pill{ color:var(--fc); background:color-mix(in srgb, var(--fc) 14%, var(--card)); }
.pct-badge{ position:relative; width:44px; height:6px; border-radius:4px; background:var(--line2); overflow:hidden; flex:none; }
.pct-badge .pct-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:4px; }
.pct-badge i{ position:absolute; left:0; top:-15px; font-style:normal; font-size:9.5px; font-weight:800; color:var(--ink3); white-space:nowrap; }
.daysrow{ display:flex; gap:5px; flex-wrap:wrap; }
.daychip{ width:38px; height:30px; border-radius:8px; border:1.5px solid var(--line2); background:var(--card); font-size:11.5px; font-weight:700; color:var(--ink2); cursor:pointer; }
.daychip[aria-pressed="true"]{ background:var(--solid); color:var(--solid-ink); border-color:var(--solid); }
.recur-extra[hidden]{ display:none; }
.set-h.sm{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink3); margin:14px 0 8px; }

/* ---------- progress widget ---------- */
.progress-w{ display:flex; flex-direction:column; gap:10px; }
.pg-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.pg-head select{ max-width:120px; padding:5px 8px; font-size:11.5px; }
.pg-body{ display:flex; align-items:center; gap:14px; }
.pg-ringwrap{ position:relative; width:72px; height:72px; flex:none; }
.pg-ringwrap svg{ display:block; }
.pg-ring{ transition:stroke-dashoffset .3s ease; }
.pg-ringtext{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; font-family:var(--font-head); color:var(--ink); }
.pg-sub{ font-size:11.5px; color:var(--ink3); font-weight:700; line-height:1.4; }

.occ-dot{ display:inline-flex; color:var(--accent-text); flex:none; width:16px; justify-content:center; }
.occ-tag{ font-style:normal; font-size:10.5px; color:var(--ink3); font-weight:700; }

/* ================= responsive ================= */
@media (max-width:1100px){
  .home-grid{ grid-template-columns:1fr 1fr; }
  .col-c{ grid-column:1/-1; order:-1; }
  .cal-layout{ grid-template-columns:1fr; }
  .cal-side{ position:static; }
}
@media (max-width:860px){
  .navbtn.menu{ display:flex; position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; z-index:110; width:42px; height:42px; align-items:center; justify-content:center; border-radius:12px; border:1.5px solid var(--line2); background:var(--card); box-shadow:var(--shadow); font-size:18px; cursor:pointer; }
  main{ padding:74px 16px 90px; }
  .sidebar{ position:fixed; z-index:112; left:0; top:0; height:100dvh; transform:translateX(-104%); transition:transform .25s ease; box-shadow:var(--shadow-lift); }
  body.nav-open .sidebar{ transform:translateX(0); }
  body.nav-open .scrim-nav{ display:block; position:fixed; inset:0; background:rgba(15,12,6,.35); z-index:111; }
  .home-grid{ grid-template-columns:1fr; }
  .ident{ margin-left:6px; }
  .notes-layout{ grid-template-columns:1fr; }
  .nlist{ position:static; max-height:none; }
  .notes-layout.has-sel .nlist{ display:none; }
  .backbtn{ display:inline-flex; }
  .cal-grid{ gap:4px; }
  .cell{ min-height:64px; padding:4px; }
  .chip{ display:none; }
  .dots{ display:flex; gap:2px; margin-top:auto; }
  .dots i{ width:5px; height:5px; border-radius:50%; }
  .more-n{ display:none; }
  .fgrid{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
  .mb-tools{ position:static; }
  .home-row2{ flex-direction:column; }
  .home-row2 > *{ flex:1 1 auto; }
  .settings-layout{ grid-template-columns:1fr; }
  .set-nav{ position:static; flex-direction:row; flex-wrap:wrap; }
  .theme-grid{ grid-template-columns:repeat(3,1fr); }
  .rt-toolbar{ gap:1px; }
  .rt-select{ max-width:90px; }
}
@media (max-width:520px){
  .ftiles,.ncards{ grid-template-columns:1fr 1fr; }
  .pform .two{ grid-template-columns:1fr; }
  .addcard{ flex-direction:column; align-items:stretch; }
  .addcard .field.date{ max-width:none; }
  .music-presets{ grid-template-columns:repeat(4,1fr); }
  .theme-grid{ grid-template-columns:repeat(2,1fr); }
  .ftoolbar > .field{ max-width:none; width:100%; }
  .sortrow{ margin-left:0; width:100%; }
  .sortsel{ flex:1; }
  .trow{ flex-wrap:wrap; row-gap:4px; }
  .trow-main{ flex:1 1 150px; order:1; }
  .trow > .cb{ order:0; }
  .trow > .pct-badge, .trow > .prio-pill, .trow > .due{ order:2; }
  .trow > .star{ order:3; }
  .trow > .tdel{ order:4; margin-left:auto; opacity:1; }
}


/* ================= public area (landing + auth) =================
   Everything below is scoped to body.public or .pub-/.auth- classes, so the private
   app's layout is untouched. body.public is toggled by render() in the router. */
body.public .sidebar, body.public .navbtn.menu, body.public .scrim-nav,
body.public .tpill, body.public .mpill{ display:none !important; }
body.public main{ padding:0; }

/* ---------- landing (editorial dark hero + hand-drawn marks) ---------- */
.pub{ min-height:100dvh; display:flex; flex-direction:column; }
.pub-wrap{ width:100%; max-width:1180px; margin:0 auto; padding:0 clamp(18px,4vw,44px); }
.pub-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:20px; padding-bottom:20px; position:relative; z-index:2; }
.pub-head .brand-mark{ font-size:28px; }
.pub-actions{ display:flex; gap:8px; align-items:center; }
.hand{ font-family:'Caveat','Segoe Print','Bradley Hand',cursive; font-weight:600; }
.btn.lg{ padding:13px 24px; font-size:15px; border-radius:999px; }

/* hero stays dark in every theme, like a book cover */
.hero{ --hero-bg:#1b1b22; --hero-ink:#f6f1e6; background:var(--hero-bg); color:var(--hero-ink); border-radius:0 0 clamp(26px,4vw,48px) clamp(26px,4vw,48px); position:relative; overflow:hidden; }
html[data-theme="dark"] .hero{ --hero-bg:#2b2926; }
.hero .brand-mark{ color:var(--hero-ink); }
.hero .btn.ghost{ color:var(--hero-ink); }
.hero .btn.ghost:hover{ background:#ffffff14; }
.hero .btn.primary{ background:var(--hero-ink); color:#1b1b22; border-color:var(--hero-ink); }
.hero .btn.primary:hover{ background:#fff; }
.hero .btn.outline{ background:transparent; color:var(--hero-ink); border-color:#f6f1e666; }
.hero .btn.outline:hover{ border-color:var(--hero-ink); background:#ffffff10; }
.hero :focus-visible{ outline-color:#f0b429; }
.hero-body{ position:relative; text-align:center; padding:clamp(44px,8vw,110px) 0 clamp(70px,10vw,140px); }
.hero-h{ position:relative; z-index:1; font-size:clamp(44px,7.4vw,96px); line-height:1.02; letter-spacing:-.025em; font-weight:500; color:var(--hero-ink); max-width:12.5ch; margin:0 auto; }
.hero-p{ position:relative; z-index:1; font-size:clamp(16px,1.6vw,19px); color:#f6f1e6c9; max-width:46ch; margin:28px auto 30px; line-height:1.6; }
.hero-ctas{ position:relative; z-index:1; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.hero-doodles{ position:absolute; inset:0; pointer-events:none; }
.dd{ position:absolute; }
.dd svg{ width:100%; height:auto; display:block; overflow:visible; }
.dd-plane{ width:118px; left:3%; top:8%; }
.dd-note{ width:124px; left:6%; bottom:14%; }
.dd-pencil{ width:84px; right:6%; top:6%; }
.dd-cal{ width:112px; right:5%; bottom:16%; }
.dd-s1{ left:22%; top:4%; } .dd-s2{ right:21%; bottom:8%; } .dd-s3{ left:17%; bottom:4%; }

/* hand-drawn editing marks */
.mark{ position:relative; display:inline-block; white-space:nowrap; }
.mark > svg{ position:absolute; pointer-events:none; overflow:visible; }
.mark.circle > svg{ left:-7%; top:-12%; width:114%; height:126%; }
.mark.under > svg{ left:-2%; bottom:-.26em; width:104%; height:.42em; }
.mark path{ fill:none; stroke:var(--mk,#f0b429); stroke-linecap:round; stroke-linejoin:round; }
.mark.circle path{ stroke-width:1.7; }
.mark.under path{ stroke-width:2.6; }
.mark.draw path{ stroke-dasharray:1; stroke-dashoffset:1; animation:drawmark 1.1s cubic-bezier(.6,.1,.3,1) .35s forwards; }
.mark.draw path + path{ animation-delay:.9s; }
@keyframes drawmark{ to{ stroke-dashoffset:0; } }

.pub-sec{ padding:clamp(60px,9vw,116px) 0 0; }
.statement{ text-align:center; max-width:860px; margin:0 auto; }
.statement h2{ font-size:clamp(32px,4.6vw,56px); line-height:1.08; letter-spacing:-.02em; font-weight:500; }
.statement p{ font-size:18px; color:var(--ink2); line-height:1.65; margin:20px auto 0; max-width:54ch; }

/* product preview: static sample content, never the user's real data */
.peek-wrap{ position:relative; max-width:880px; margin:clamp(48px,7vw,80px) auto 0; }
.peek-cap{ position:absolute; right:-6px; top:-58px; font-size:27px; color:var(--ink2); transform:rotate(-3deg); display:flex; align-items:flex-end; gap:4px; }
.peek-cap svg{ width:54px; height:48px; margin-bottom:-26px; }
.peek-cap path{ fill:none; stroke:var(--ink2); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.peek-frame{ background:var(--paper2); border:1.5px solid var(--line); border-radius:24px; padding:16px; box-shadow:var(--shadow-lift); display:grid; grid-template-columns:1.1fr 1fr; gap:12px; }
.peek-frame .card{ padding:14px; }
.peek-t{ font-family:var(--font-head); font-size:17px; margin-bottom:8px; }
.peek-row{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:14px; font-weight:600; border-bottom:1.5px dashed var(--line); }
.peek-row:last-child{ border-bottom:none; }
.peek-cb{ width:17px; height:17px; border-radius:5px; border:1.5px solid var(--line2); flex:none; display:grid; place-items:center; }
.peek-row.done .peek-cb{ background:var(--green); border-color:var(--green); color:#fff; }
.peek-row.done span{ text-decoration:line-through; color:var(--ink3); }
.peek-dot{ width:8px; height:8px; border-radius:50%; margin-left:auto; flex:none; }
.peek-timer{ text-align:center; }
.peek-timer .plant, .dd .plant{ width:82px; height:88px; display:block; margin:0 auto; }
.peek-timer .plant .lf, .dd .plant .lf{ opacity:1; }
.peek-time{ font-family:var(--font-head); font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; }
.peek-notes{ grid-column:1/-1; display:flex; gap:12px; }
.peek-note{ flex:1; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:700; color:#1b1b22; min-height:82px; box-shadow:var(--shadow); }
.peek-note:nth-child(1){ transform:rotate(-1.5deg); }
.peek-note:nth-child(2){ transform:rotate(1.2deg); }
.peek-note:nth-child(3){ transform:rotate(-.4deg); }

/* ---------- "A day in CASE!" (replaces the old feature list + yellow panel) ----------
   A single sample workspace; the chosen moment highlights the parts involved and a pen line
   links them. Sample content only. Theme swatches restyle .ws alone, never the real theme. */
.day-head{ max-width:640px; margin-bottom:clamp(28px,4vw,48px); }
.day-head h2{ font-size:clamp(32px,4.4vw,54px); line-height:1.06; letter-spacing:-.02em; font-weight:500; }
.day-head p{ color:var(--ink2); font-size:17px; line-height:1.65; margin:14px 0 0; max-width:50ch; }
.day-grid{ display:grid; grid-template-columns:minmax(250px,300px) minmax(0,1fr); gap:clamp(24px,4vw,56px); align-items:start; }
.day-side{ position:sticky; top:28px; }
.day-tabs{ display:flex; flex-direction:column; gap:4px; }
.moment{ display:grid; grid-template-columns:auto 1fr; column-gap:12px; align-items:baseline; text-align:left; width:100%; padding:12px 16px 12px 14px; border-radius:14px; border:1.5px solid transparent; background:none; color:var(--ink2); cursor:pointer; transition:background .25s ease, border-color .25s ease, box-shadow .25s ease; }
.moment:hover{ background:#00000008; }
.moment[aria-selected="true"]{ background:var(--card); border-color:var(--line); box-shadow:var(--shadow); color:var(--ink); }
.m-dot{ width:9px; height:9px; border-radius:50%; background:var(--mc); align-self:center; opacity:.45; transition:opacity .25s ease, transform .25s ease; }
.moment[aria-selected="true"] .m-dot{ opacity:1; transform:scale(1.25); }
.m-time{ font-family:'Caveat','Segoe Print','Bradley Hand',cursive; font-weight:600; font-size:19px; color:var(--ink3); line-height:1; }
.m-name{ grid-column:2; font-family:var(--font-head); font-size:20px; font-weight:600; line-height:1.2; margin-top:3px; }
.day-desc{ margin:18px 2px 0; color:var(--ink2); font-size:15.5px; line-height:1.6; min-height:5.2em; }
.day-try{ margin:14px 2px 0; }
.day-try-l{ font-size:13px; font-weight:800; color:var(--ink3); margin:0 0 8px; }
.swatches{ display:flex; gap:8px; flex-wrap:wrap; }
.swatch{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line2); cursor:pointer; padding:0; background:linear-gradient(135deg, var(--sp) 50%, var(--sc) 50%); transition:transform .2s ease, box-shadow .2s ease; }
.swatch:hover{ transform:scale(1.08); }
.swatch[aria-checked="true"]{ box-shadow:0 0 0 2.5px var(--paper), 0 0 0 4.5px var(--ink); }

.day-stage{ position:relative; }
.day-cap{ text-align:right; font-size:25px; color:var(--ink2); transform:rotate(-2deg); margin:0 8px 6px; min-height:1.3em; transition:opacity .25s ease; }
.ws{ position:relative; display:grid; grid-template-columns:46px minmax(0,1fr); gap:12px; background:var(--paper); color:var(--ink); border:1.5px solid var(--line); border-radius:26px; padding:12px; box-shadow:var(--shadow-lift); transition:background .35s ease, border-color .35s ease; }
.ws-rail{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0; background:var(--paper2); border-radius:16px; border:1.5px solid var(--line); transition:background .35s ease; }
.ws-rail b{ font-family:var(--font-head); font-style:italic; font-weight:700; font-size:14px; margin-bottom:6px; }
.ws-rail i{ width:30px; height:30px; display:grid; place-items:center; border-radius:9px; color:var(--c); opacity:.55; transition:background .25s ease, opacity .25s ease; }
.ws-rail i.on{ background:var(--card); opacity:1; box-shadow:var(--shadow); }
.ws-main{ display:grid; grid-template-columns:1.15fr 1.2fr .9fr; grid-template-areas:"ban ban ban" "todo cal timer" "note board timer" "fold fold amb"; gap:10px; min-width:0; }
.w{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:12px 13px; min-width:0; transition:opacity .35s ease, filter .35s ease, box-shadow .35s ease, border-color .35s ease, background .35s ease; }
.w-t{ font-family:var(--font-head); font-size:15px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.w-t svg{ color:var(--c); }
.w-s{ font-size:11.5px; color:var(--ink3); font-weight:700; }
.w-ban{ grid-area:ban; height:54px; padding:0; overflow:hidden; background:var(--card); }
.w-ban svg{ width:100%; height:100%; display:block; }
.w-todo{ grid-area:todo; } .w-cal{ grid-area:cal; } .w-timer{ grid-area:timer; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.w-note{ grid-area:note; } .w-board{ grid-area:board; } .w-fold{ grid-area:fold; display:flex; align-items:center; gap:12px; } .w-amb{ grid-area:amb; }
.tr{ display:flex; align-items:center; gap:7px; padding:4.5px 0; font-size:12.5px; font-weight:700; border-bottom:1.5px dashed var(--line); }
.tr:last-child{ border-bottom:none; }
.tr .cb{ width:14px; height:14px; border-radius:4px; border:1.5px solid var(--line2); flex:none; display:grid; place-items:center; }

.tr.done span{ text-decoration:line-through; color:var(--ink3); }
.tr em{ margin-left:auto; font-style:normal; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:6px; background:color-mix(in srgb, var(--blue) 14%, var(--card)); color:var(--blue-d); }
.wk{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; margin:4px 0 8px; }

.ev{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; padding:3px 0; }
.ev::before{ content:''; width:3px; height:14px; border-radius:2px; background:var(--c); }

.w-timer .plant{ width:62px; height:66px; display:block; }

.nl{ font-size:12.5px; line-height:1.5; }

.nl .ck{ display:flex; align-items:center; gap:6px; color:var(--ink2); font-weight:600; }
.nl .ck i{ width:11px; height:11px; border-radius:3px; border:1.5px solid var(--line2); }
.mb{ position:relative; height:104px; border-radius:10px; background:linear-gradient(var(--line) 1px, transparent 1px) 0 0/14px 14px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/14px 14px; overflow:hidden; }
.mb > *{ position:absolute; box-shadow:0 2px 6px rgba(30,25,10,.12); }
.mb .img{ left:8%; top:12%; width:38%; height:62%; border-radius:6px; background:#dfeee0; overflow:hidden; }
.mb .img svg{ width:100%; height:100%; display:block; }
.mb .stk{ left:52%; top:10%; width:40%; padding:6px 7px; border-radius:6px; background:#fff1a8; color:#1b1b22; font-size:10.5px; font-weight:800; line-height:1.25; transform:rotate(3deg); }
.mb .sw{ width:18px; height:18px; border-radius:5px; top:auto; bottom:10%; }
.fold-ic{ width:40px; height:40px; flex:none; }

.fold-chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
.fold-chips span{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:7px; background:var(--paper2); border:1.5px solid var(--line); color:var(--ink2); }
.fold-chips svg{ color:var(--c); }
.eq{ display:flex; align-items:flex-end; gap:3px; height:22px; margin:8px 0 6px; }
.eq i{ width:5px; border-radius:2px; background:var(--purple); opacity:.8; }
.vol{ height:5px; border-radius:3px; background:linear-gradient(90deg, var(--purple) 62%, var(--line) 62%); }

/* moment states: highlighted parts stay crisp, the rest steps back */
.ws[data-m="plan"] .w:not(.w-todo):not(.w-cal),
.ws[data-m="idea"] .w:not(.w-note):not(.w-board):not(.w-fold),
.ws[data-m="focus"] .w:not(.w-timer):not(.w-amb){ opacity:.4; filter:saturate(.35); }
.ws[data-m="focus"]{ background:var(--paper2); }
.w.hl{ border-color:color-mix(in srgb, var(--hc) 55%, var(--line)); box-shadow:0 0 0 3px color-mix(in srgb, var(--hc) 16%, transparent), var(--shadow); }
.ws-links{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.ws-links path{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; opacity:.8; }
.ws-links path.ring{ stroke:var(--yellow); stroke-width:2.6; opacity:1; }
.ws-links.draw path{ stroke-dasharray:1; stroke-dashoffset:1; animation:drawmark .9s cubic-bezier(.6,.1,.3,1) forwards; }
.ws-links.draw path.ring{ animation-delay:.55s; }
.ws-links.draw path.ring:first-child{ animation-delay:0s; }
.ws-links.draw path.head{ animation-delay:.75s; animation-duration:.3s; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* closing call to action */
.cta-band{ background:#1b1b22; color:#f6f1e6; border-radius:32px; padding:clamp(40px,7vw,84px) clamp(22px,5vw,48px); text-align:center; position:relative; overflow:hidden; }

.cta-band p{ margin:14px auto 26px; color:#f6f1e6c9; max-width:44ch; font-size:17px; }
.cta-band .btn.lg{ background:#f6f1e6; color:#1b1b22; border-color:#f6f1e6; }
.cta-band .btn.lg:hover{ background:#fff; }
.cta-band :focus-visible{ outline-color:#f0b429; }

.pub-foot{ margin-top:clamp(44px,7vw,80px); border-top:1.5px solid var(--line); padding-top:22px; padding-bottom:30px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; color:var(--ink3); font-size:13.5px; }
.pub-foot .brand-mark{ font-size:20px; color:var(--ink); }
.pub-foot nav{ display:flex; gap:16px; }
.pub-foot a{ font-weight:700; color:var(--ink2); }
.pub-foot a:hover{ color:var(--ink); }

/* auth screens */
.auth{ min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px 16px; gap:16px; }
.auth-card{ width:100%; max-width:430px; padding:0; overflow:hidden; }
.auth-art{ height:74px; border-bottom:1.5px solid var(--line); }
.auth-art svg{ width:100%; height:100%; display:block; }

.auth-form{ display:flex; flex-direction:column; gap:12px; }

.auth-row a, .auth-alt a{ color:var(--accent-text); font-weight:700; }
.auth-err{ color:var(--red-d); font-size:13.5px; font-weight:700; margin:0; }
.auth-err:empty{ display:none; }
.auth-note{ background:color-mix(in srgb, var(--yellow) 14%, var(--card)); border:1.5px solid color-mix(in srgb, var(--yellow-d) 40%, var(--line)); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--ink2); line-height:1.5; margin:0 0 16px; }
.auth-note strong{ color:var(--ink); }
.auth-done{ background:color-mix(in srgb, var(--green) 12%, var(--card)); border:1.5px solid color-mix(in srgb, var(--green) 40%, var(--line)); border-radius:10px; padding:12px 14px; font-size:14px; color:var(--ink); line-height:1.5; }
.auth-or{ display:flex; align-items:center; gap:10px; color:var(--ink3); font-size:12.5px; font-weight:700; margin:16px 0 12px; }
.auth-or::before, .auth-or::after{ content:''; flex:1; height:1.5px; background:var(--line); }
.auth-prov{ display:flex; flex-direction:column; gap:8px; }

.auth-alt{ text-align:center; font-size:14px; color:var(--ink2); margin:0; }
.auth-back{ font-size:13.5px; font-weight:700; color:var(--ink3); }

/* ================= "pop" visual pass (landing bands, CTA stickers, footer, auth) =================
   Scoped to: .band, .peek-*, .cta-band additions, .pub-foot, .auth*. Does NOT touch .hero or .day. */
:root{ --pop-edge:#1b1b22; --pop-shadow:#1b1b22; --pop-mint:#a9dcbd; --pop-sky:#bfe1f2; --pop-butter:#ffe38f; --pop-coral:#ffb3a7; --pop-lilac:#d9ccf5; }
html[data-theme="dark"]{ --pop-edge:#4a453f; --pop-shadow:#000; }
.pop-star{ display:block; overflow:visible; }
.pop-star path{ stroke:#1b1b22; stroke-width:1.6; stroke-linejoin:round; }

/* full-bleed color bands: border-image paints edge to edge without adding horizontal scroll.
   Outset is 50vw (enough to reach both screen edges); much larger values make Chrome change how it
   rasterizes the page, which subtly alters text smoothing in the locked sections. */
.band{ --band:var(--pop-mint); border-image:linear-gradient(var(--band),var(--band)) fill 0 / 0 / 0 50vw; }
html[data-theme="dark"] .band-mint{ --band:#22362b; }
.band-mint{ margin-top:calc(-1 * clamp(26px,4vw,48px)); padding-top:calc(clamp(60px,9vw,116px) + clamp(26px,4vw,48px)); padding-bottom:96px; }
.band-mint .mark{ --mk:#e0604c; }
.band-mint .statement{ position:relative; }
.band-deco{ position:absolute; inset:0; pointer-events:none; }
.band-deco > *{ position:absolute; }
.bd-star1{ left:-6%; top:-18px; width:46px; transform:rotate(-8deg); }
.bd-star2{ right:-4%; top:26%; width:30px; }
.bd-star3{ left:4%; bottom:-6px; width:22px; }
.bd-plane{ right:-13%; top:-64px; width:112px; }
.bd-plane path{ stroke:#1b1b22; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.peek-frame{ border:2px solid var(--pop-edge); box-shadow:10px 10px 0 var(--pop-shadow); }
.peek-star{ position:absolute; left:-18px; top:-20px; width:44px; z-index:1; transform:rotate(12deg); }
.peek-badge{ position:absolute; right:22px; bottom:-16px; z-index:1; background:var(--pop-coral); color:#1b1b22; border:2px solid #1b1b22; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:800; transform:rotate(-3deg); box-shadow:3px 3px 0 #1b1b22; }

/* pop buttons (new class; the app's buttons are untouched) */
.btn.pop{ border:2px solid #1b1b22; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
.btn.pop:hover{ transform:translate(-2px,-2px); }
.btn.pop:active{ transform:translate(2px,2px); box-shadow:0 0 0 transparent !important; }
.cta-band .btn.pop{ background:var(--pop-butter); color:#1b1b22; border-color:#1b1b22; box-shadow:4px 4px 0 #f6f1e6; }
.cta-band .btn.pop:hover{ background:#ffeaa8; box-shadow:6px 6px 0 #f6f1e6; }

/* closing CTA: feature stickers */
.cta-band h2 .mark{ --mk:#f0b429; }
.cta-stickers{ position:absolute; inset:0; pointer-events:none; }
.sticker{ position:absolute; display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:12px; border:2px solid #1b1b22; background:var(--sc); color:#1b1b22; font-size:14px; font-weight:800; box-shadow:3px 3px 0 #f6f1e6; transform:rotate(var(--r)); white-space:nowrap; }
.sticker svg{ flex:none; }
.st-1{ left:5%; top:16%; } .st-2{ left:11%; top:47%; } .st-3{ left:4%; bottom:14%; } .st-4{ right:5%; top:13%; }
.st-5{ right:12%; top:42%; } .st-6{ right:4%; bottom:30%; } .st-7{ right:14%; bottom:9%; }
.cta-star{ position:absolute; width:26px; }
.cta-star.s1{ left:24%; top:12%; } .cta-star.s2{ right:26%; bottom:14%; width:20px; }

/* footer on a sky band */
.pub-foot{ --band:var(--pop-sky); border-top:0; border-image:linear-gradient(var(--band),var(--band)) fill 0 / 0 / 0 50vw; padding-top:34px; padding-bottom:40px; color:var(--ink2); position:relative; }
html[data-theme="dark"] .pub-foot{ --band:#1f3140; }
.pub-foot .brand-mark{ display:inline-flex; align-items:center; gap:8px; font-size:24px; }
.pub-foot .brand-mark .pop-star{ width:18px; }
.pub-foot nav{ gap:10px; flex-wrap:wrap; }
.pub-foot nav a{ padding:8px 16px; border-radius:999px; border:2px solid #1b1b22; background:#fffdf8; color:#1b1b22; box-shadow:2px 2px 0 #1b1b22; transition:transform .15s ease, box-shadow .15s ease; }
.pub-foot nav a:last-child{ background:var(--pop-butter); }
.pub-foot nav a:hover{ color:#1b1b22; transform:translate(-1px,-1px); box-shadow:3px 3px 0 #1b1b22; }

/* ---------- auth screens ---------- */
.auth{ position:relative; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:26px 18px 34px; overflow:hidden;
  background:radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 14%, transparent) 1.1px, transparent 1.7px) 0 0/22px 22px, var(--paper); }
.auth-deco{ position:absolute; inset:0; pointer-events:none; }
.auth-deco > *{ position:absolute; }
.auth-blob{ border-radius:50%; border:2px solid var(--pop-edge); }
.ab-1{ width:340px; height:340px; left:-120px; top:-110px; background:var(--pop-mint); }
.ab-2{ width:260px; height:260px; right:-90px; bottom:-100px; background:var(--pop-butter); }
.ab-3{ width:80px; height:80px; left:3%; top:44%; background:var(--pop-coral); }
.as-1{ left:calc(50% - 560px); bottom:16%; width:40px; transform:rotate(-10deg); } .as-2{ right:calc(50% - 548px); top:40%; width:26px; } .as-3{ left:calc(50% - 540px); top:24%; width:20px; }
.auth-top{ position:relative; z-index:1; width:100%; max-width:980px; display:flex; align-items:center; }
.auth-top .brand-mark{ font-size:28px; }
.auth-card{ position:relative; z-index:1; width:100%; max-width:980px; display:grid; grid-template-columns:minmax(0,.92fr) minmax(0,1fr); background:var(--card); border:2px solid var(--pop-edge); border-radius:28px; box-shadow:10px 10px 0 var(--pop-shadow); overflow:hidden; padding:0; }
.auth-card[data-kind="signin"]{ --side:var(--pop-butter); }
.auth-card[data-kind="signup"]{ --side:var(--pop-mint); }
.auth-card[data-kind="forgot"]{ --side:var(--pop-sky); }
.auth-side{ background:var(--side); color:#1b1b22; padding:28px 30px 30px; display:flex; flex-direction:column; gap:16px; border-right:2px solid var(--pop-edge); position:relative; }
.auth-side .auth-art{ height:84px; border-radius:16px; border:2px solid #1b1b22; overflow:hidden; background:#fffdf8; }
.auth-side .auth-art svg{ width:100%; height:100%; display:block; }
.auth-side h2{ font-size:clamp(26px,2.7vw,34px); line-height:1.1; letter-spacing:-.01em; font-weight:600; color:#1b1b22; }
.auth-side > p{ margin:-6px 0 0; font-size:15.5px; line-height:1.6; color:#1b1b22cc; }
.auth-perks{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.auth-perks li{ display:flex; align-items:flex-start; gap:10px; font-size:14.5px; font-weight:700; line-height:1.45; }
.auth-perks i{ flex:none; width:22px; height:22px; border-radius:50%; background:#1b1b22; color:var(--side); display:grid; place-items:center; margin-top:1px; }
.auth-scene{ margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding-top:6px; }
.auth-scene .notes-svg{ width:170px; height:auto; }
.auth-scene .plant{ width:70px; height:76px; }
.auth-scene .plant .lf{ opacity:1; }
.auth-in{ padding:34px 38px 32px; }
.auth-in h1{ font-size:clamp(28px,3vw,36px); margin-bottom:4px; letter-spacing:-.01em; }
.auth-in > .psub{ margin-bottom:18px; font-size:15px; }
.auth-note{ background:color-mix(in srgb, var(--pop-butter) 30%, var(--card)); border:2px dashed color-mix(in srgb, var(--yellow-d) 55%, var(--line)); border-radius:12px; padding:10px 12px; margin:0 0 18px; }
.auth-note strong{ display:inline-block; background:#1b1b22; color:var(--pop-butter); border-radius:6px; padding:0 7px; margin-right:4px; font-size:12px; }
.auth-form{ gap:14px; }
.auth-form .flabel{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:800; color:var(--ink); }
.auth-form .field{ border:2px solid var(--line2); border-radius:12px; padding:12px 14px; font-size:15px; background:var(--paper2); transition:border-color .15s ease, box-shadow .15s ease, background .15s ease; }
.auth-form .field:hover{ border-color:color-mix(in srgb, var(--ink) 35%, var(--line2)); }
.auth-form .field:focus{ outline:none; border-color:var(--ink); background:var(--card); box-shadow:3px 3px 0 var(--side, var(--accent)); }
.auth-form .btn.pop{ background:#1b1b22; color:#fffdf8; box-shadow:4px 4px 0 var(--side); padding:13px 20px; font-size:15.5px; border-radius:14px; }
html[data-theme="dark"] .auth-form .btn.pop{ border-color:#000; }
.auth-form .btn.pop:hover{ box-shadow:6px 6px 0 var(--side); }
.auth-row a, .auth-alt a{ color:var(--accent-text); font-weight:800; text-underline-offset:3px; }
.auth-row a:hover, .auth-alt a:hover{ text-decoration:underline; }
.auth-err{ background:color-mix(in srgb, var(--red) 10%, var(--card)); border-radius:10px; padding:8px 11px; }
.auth-done{ border-width:2px; border-radius:12px; }
.auth-or{ margin:18px 0 12px; }
.auth-prov .btn[disabled]{ border:2px dashed var(--line2); background:transparent; color:var(--ink3); opacity:1; box-shadow:none; }
.auth-alt{ margin-top:20px !important; }
.auth-back{ position:relative; z-index:1; display:inline-flex; padding:7px 14px; border-radius:999px; background:var(--card); border:2px solid var(--pop-edge); color:var(--ink2); }
.auth-back:hover{ color:var(--ink); }

@media (max-width:1100px){
  .bd-plane{ display:none; } .bd-star1{ left:0; top:-52px; width:30px; }
  .st-2, .st-5{ display:none; }
}
@media (max-width:860px){
  .band-mint{ padding-bottom:80px; }

  .auth-side{ border-right:0; border-bottom:2px solid var(--pop-edge); padding:20px 22px; gap:10px; }
  .auth-side .auth-art, .auth-perks, .auth-scene{ display:none; }
  .auth-side h2{ font-size:24px; }
  .auth-side > p{ margin:0; font-size:14.5px; }

  .bd-plane, .bd-star2{ display:none; }
